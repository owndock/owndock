name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'owndock/owndock'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    outputs:
      version: ${{ steps.release.outputs.version }}
      identity: ${{ steps.release.outputs.identity }}
      build_time: ${{ steps.release.outputs.build_time }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate immutable release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          version=${tag#v}
          if [[ "v${version}" != "${tag}" ]] || \
             [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tags must use vMAJOR.MINOR.PATCH SemVer" >&2
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]] || \
             [[ "$(git rev-parse "${tag}^{commit}")" != "${GITHUB_SHA}" ]]; then
            echo "release tag does not resolve to the checked out commit" >&2
            exit 2
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "release checkout is not clean" >&2
            exit 2
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "release ${tag} already exists; refusing to rebuild it" >&2
            exit 2
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'identity=%s\n' \
            "https://github.com/owndock/owndock/.github/workflows/release.yml@refs/tags/${tag}" \
            >> "${GITHUB_OUTPUT}"
          printf 'build_time=%s\n' "$(git show -s --format=%cI HEAD)" \
            >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Reject non-monotonic release version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 1000 --exclude-drafts --json tagName \
            --jq '.[].tagName' | \
            go run ./internal/tools/adjacentrelease \
              -current "${GITHUB_REF_NAME}" -require-newest >/dev/null
      - run: go mod download
      - name: Run repository-local release candidate gate
        run: make test-release-candidate
      - name: Build deterministic Agent release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make package-agent-release VERSION="${VERSION}" COMMIT="${GITHUB_SHA}"
      - name: Build deterministic community deployment bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD \
            deploy/community.compose.yaml \
            deploy/community.config.yaml \
            deploy/backup-community.sh \
            deploy/mongodb/init-replica-set.sh \
            deploy/prepare-community-secrets.sh \
            deploy/restore-community.sh \
            docs/community-installation.md \
            docs/ingress-protection.md \
            docs/release-readiness.md \
            | gzip -n > "dist/owndock-community_${VERSION}.tar.gz"
          install -m 0755 packaging/release/verify-community-release \
            dist/verify-community-release
      - name: Install fixed Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign and verify the release manifest
        env:
          CERTIFICATE_IDENTITY: ${{ steps.release.outputs.identity }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS
          cosign verify-blob dist/SHA256SUMS \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-blob dist/SHA256SUMS \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --offline
      - name: Preserve verified Agent release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  containers:
    if: github.repository == 'owndock/owndock'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: owndock
            dockerfile: Dockerfile
          - image: owndock-build-worker
            dockerfile: Dockerfile.build-worker
          - image: owndock-egress-gateway
            dockerfile: Dockerfile.egress-gateway
          - image: owndock-evidence-worker
            dockerfile: Dockerfile.evidence-worker
          - image: owndock-vulnerability-db-updater
            dockerfile: Dockerfile.vulnerability-db-updater
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and push immutable multi-architecture image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/owndock/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ needs.validate.outputs.build_time }}
          provenance: mode=max
          sbom: true
      - name: Install fixed Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign and verify immutable image digest
        env:
          CERTIFICATE_IDENTITY: ${{ needs.validate.outputs.identity }}
          IMAGE: ghcr.io/owndock/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          mkdir -p container-digests
          printf '%s@%s\n' "${IMAGE}" "${DIGEST}" \
            > "container-digests/${{ matrix.image }}.txt"
      - name: Preserve immutable image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-digest-${{ matrix.image }}-${{ github.sha }}
          path: container-digests/
          if-no-files-found: error
          retention-days: 1

  community-compatibility:
    if: github.repository == 'owndock/owndock'
    needs: [validate, containers]
    name: community-compatibility (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            goarch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Verify native Linux community environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = "${{ matrix.machine }}"
          test -s /sys/fs/cgroup/cgroup.controllers
          test "$(docker info --format '{{.OSType}}')" = linux
          test "$(docker info --format '{{.Architecture}}')" = "${{ matrix.machine }}"
          docker info --format \
            'docker={{.ServerVersion}} os={{.OSType}} arch={{.Architecture}} cgroup={{.CgroupVersion}} storage={{.Driver}}'
      - name: Resolve previous published release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag=$(gh release list --limit 1000 --exclude-drafts --json tagName \
            --jq '.[].tagName' | \
            go run ./internal/tools/adjacentrelease \
              -current "${CURRENT_TAG}" -require-newest)
          if [[ -z "${previous_tag}" ]]; then
            printf 'has_previous=false\n' >> "${GITHUB_OUTPUT}"
            printf '### Community pre-publish compatibility\n\n%s\n' \
              'This is the first release baseline; no adjacent release exists.' \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          printf 'has_previous=true\n' >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${previous_tag}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${previous_tag#v}" >> "${GITHUB_OUTPUT}"
      - name: Install fixed Cosign release
        if: steps.previous.outputs.has_previous == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Download previous signed community assets
        if: steps.previous.outputs.has_previous == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compatibility/previous
          gh release download "${PREVIOUS_TAG}" --dir compatibility/previous \
            --pattern "owndock-community_${PREVIOUS_VERSION}.tar.gz" \
            --pattern COMMUNITY_SHA256SUMS \
            --pattern COMMUNITY_SHA256SUMS.sigstore.json \
            --pattern 'COMMUNITY_COMPATIBILITY_*.txt' \
            --pattern CONTAINER_IMAGES.txt \
            --pattern CONTAINER_IMAGES.sigstore.json \
            --pattern verify-community-release
      - name: Verify previous release identity and resolve Server image
        if: steps.previous.outputs.has_previous == 'true'
        id: previous-image
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          directory=compatibility/previous
          identity="https://github.com/owndock/owndock/.github/workflows/release.yml@refs/tags/${PREVIOUS_TAG}"
          cosign verify-blob "${directory}/COMMUNITY_SHA256SUMS" \
            --bundle "${directory}/COMMUNITY_SHA256SUMS.sigstore.json" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --offline
          cosign verify-blob "${directory}/CONTAINER_IMAGES.txt" \
            --bundle "${directory}/CONTAINER_IMAGES.sigstore.json" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --offline
          (cd "${directory}" && sha256sum --check COMMUNITY_SHA256SUMS)
          mapfile -t references < <(
            grep -E '^ghcr\.io/owndock/owndock@sha256:[0-9a-f]{64}$' \
              "${directory}/CONTAINER_IMAGES.txt" || true
          )
          if [[ "${#references[@]}" -ne 1 ]]; then
            echo "previous container manifest must contain exactly one immutable Server image" >&2
            exit 2
          fi
          printf 'reference=%s\n' "${references[0]}" >> "${GITHUB_OUTPUT}"
      - name: Restore current immutable Server digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-digest-owndock-${{ github.sha }}
          path: compatibility/current-digest
      - name: Resolve current Server image
        id: current-image
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t references < <(
            grep -hE '^ghcr\.io/owndock/owndock@sha256:[0-9a-f]{64}$' \
              compatibility/current-digest/*.txt || true
          )
          if [[ "${#references[@]}" -ne 1 ]]; then
            echo "current build must provide exactly one immutable Server image" >&2
            exit 2
          fi
          printf 'reference=%s\n' "${references[0]}" >> "${GITHUB_OUTPUT}"
      - name: Login to GitHub Container Registry
        if: steps.previous.outputs.has_previous == 'true'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Gate publish on signed adjacent compatibility
        if: steps.previous.outputs.has_previous == 'true'
        env:
          CURRENT_IMAGE: ${{ steps.current-image.outputs.reference }}
          CURRENT_VERSION: ${{ needs.validate.outputs.version }}
          PREVIOUS_IMAGE: ${{ steps.previous-image.outputs.reference }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${PREVIOUS_IMAGE}"
          docker pull "${CURRENT_IMAGE}"
          cosign verify "${PREVIOUS_IMAGE}" \
            --certificate-identity \
              "https://github.com/owndock/owndock/.github/workflows/release.yml@refs/tags/${PREVIOUS_TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify "${CURRENT_IMAGE}" \
            --certificate-identity \
              "https://github.com/owndock/owndock/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          deploy/community_process_integration_test.sh \
            "${PREVIOUS_IMAGE}" "${PREVIOUS_VERSION}" \
            "${CURRENT_IMAGE}" "${CURRENT_VERSION}"
          {
            printf '### Community pre-publish compatibility\n\n'
            printf -- '- Previous: `%s`\n' "${PREVIOUS_TAG}"
            printf -- '- Candidate: `%s`\n' "${GITHUB_REF_NAME}"
            printf -- '- Signed adjacent upgrade, rollback, and recovery passed\n'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Create community compatibility evidence
        env:
          CURRENT_IMAGE: ${{ steps.current-image.outputs.reference }}
          CURRENT_VERSION: ${{ needs.validate.outputs.version }}
          HAS_PREVIOUS: ${{ steps.previous.outputs.has_previous }}
          PREVIOUS_IMAGE: ${{ steps.previous-image.outputs.reference }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compatibility-report
          report="compatibility-report/COMMUNITY_COMPATIBILITY_${{ matrix.goarch }}.txt"
          {
            printf 'schema=owndock-community-compatibility-v1\n'
            printf 'result=%s\n' "$(if [[ "${HAS_PREVIOUS}" == true ]]; then printf passed; else printf baseline; fi)"
            printf 'current_tag=%s\n' "${GITHUB_REF_NAME}"
            printf 'current_version=%s\n' "${CURRENT_VERSION}"
            printf 'current_commit=%s\n' "${GITHUB_SHA}"
            printf 'architecture=%s\n' '${{ matrix.goarch }}'
            printf 'machine=%s\n' "$(uname -m)"
            printf 'kernel=%s\n' "$(uname -r)"
            printf 'docker_engine=%s\n' "$(docker info --format '{{.ServerVersion}}')"
            printf 'previous_tag=%s\n' "${PREVIOUS_TAG}"
            printf 'previous_version=%s\n' "${PREVIOUS_VERSION}"
            printf 'previous_image=%s\n' "${PREVIOUS_IMAGE}"
            printf 'current_image=%s\n' "${CURRENT_IMAGE}"
          } > "${report}"
          test ! -L "${report}"
          test -s "${report}"
      - name: Preserve community compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-compatibility-${{ github.sha }}-${{ matrix.goarch }}
          path: compatibility-report/
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.repository == 'owndock/owndock'
    needs: [validate, containers, community-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Restore verified Agent release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-release-${{ github.sha }}
          path: dist
      - name: Restore container image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-digest-*-${{ github.sha }}
          path: container-digests
          merge-multiple: true
      - name: Restore community compatibility evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: community-compatibility-${{ github.sha }}-*
          path: dist
          merge-multiple: true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Promote verified digests to immutable version tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find container-digests -type f -name '*.txt' | wc -l | xargs)" = "5"
          while IFS= read -r reference; do
            image=${reference%@*}
            digest=${reference#*@}
            test "${image}" != "${reference}"
            tag="${image}:${VERSION}"
            existing="$(docker buildx imagetools inspect "${tag}" \
              --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)"
            if [[ -n "${existing}" && "${existing}" != "${digest}" ]]; then
              echo "container image ${tag} already points to ${existing}; refusing replacement" >&2
              exit 2
            fi
            if [[ "${existing}" == "${digest}" ]]; then
              continue
            fi
            docker buildx imagetools create --tag "${tag}" "${reference}"
            promoted="$(docker buildx imagetools inspect "${tag}" \
              --format '{{json .Manifest}}' | jq -r '.digest // empty')"
            test "${promoted}" = "${digest}"
          done < <(LC_ALL=C sort container-digests/*.txt)
      - name: Install fixed Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Create and sign container digest manifest
        env:
          CERTIFICATE_IDENTITY: ${{ needs.validate.outputs.identity }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find container-digests -type f -name '*.txt' | wc -l | xargs)" = "5"
          LC_ALL=C sort container-digests/*.txt > dist/CONTAINER_IMAGES.txt
          test "$(wc -l < dist/CONTAINER_IMAGES.txt | xargs)" = "5"
          cosign sign-blob --yes \
            --bundle dist/CONTAINER_IMAGES.sigstore.json \
            dist/CONTAINER_IMAGES.txt
          cosign verify-blob dist/CONTAINER_IMAGES.txt \
            --bundle dist/CONTAINER_IMAGES.sigstore.json \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-blob dist/CONTAINER_IMAGES.txt \
            --bundle dist/CONTAINER_IMAGES.sigstore.json \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --offline
          cd dist
          test -s COMMUNITY_COMPATIBILITY_amd64.txt
          test -s COMMUNITY_COMPATIBILITY_arm64.txt
          sha256sum \
            "owndock-community_${{ needs.validate.outputs.version }}.tar.gz" \
            CONTAINER_IMAGES.txt \
            COMMUNITY_COMPATIBILITY_amd64.txt \
            COMMUNITY_COMPATIBILITY_arm64.txt \
            verify-community-release > COMMUNITY_SHA256SUMS
          cd ..
          cosign sign-blob --yes \
            --bundle dist/COMMUNITY_SHA256SUMS.sigstore.json \
            dist/COMMUNITY_SHA256SUMS
          cosign verify-blob dist/COMMUNITY_SHA256SUMS \
            --bundle dist/COMMUNITY_SHA256SUMS.sigstore.json \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --offline
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; refusing to replace assets" >&2
            exit 2
          fi
          flags=()
          if [[ "${VERSION}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "OwnDock ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${flags[@]}" \
            "dist/owndock-agent_${VERSION}_linux_amd64.tar.gz" \
            "dist/owndock-agent_${VERSION}_linux_arm64.tar.gz" \
            dist/RELEASE.txt \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sigstore.json \
            dist/CONTAINER_IMAGES.txt \
            dist/CONTAINER_IMAGES.sigstore.json \
            "dist/owndock-community_${VERSION}.tar.gz" \
            dist/COMMUNITY_SHA256SUMS \
            dist/COMMUNITY_SHA256SUMS.sigstore.json \
            dist/COMMUNITY_COMPATIBILITY_amd64.txt \
            dist/COMMUNITY_COMPATIBILITY_arm64.txt \
            dist/verify-community-release \
            dist/verify-owndock-agent-release
      - name: Dispatch adjacent release compatibility matrices
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run agent-release-compatibility.yml \
            --ref "${GITHUB_REF_NAME}" \
            --field current_tag="${GITHUB_REF_NAME}"
          gh workflow run community-release-compatibility.yml \
            --ref "${GITHUB_REF_NAME}" \
            --field current_tag="${GITHUB_REF_NAME}"
