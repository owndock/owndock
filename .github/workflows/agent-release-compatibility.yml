name: agent-release-compatibility

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      current_tag:
        description: Published release tag to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-release-compatibility-${{ github.event.release.tag_name || inputs.current_tag }}
  cancel-in-progress: false

jobs:
  adjacent-packages:
    if: github.repository == 'owndock/owndock'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve adjacent published releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.current_tag }}
        shell: bash
        run: |
          set -euo pipefail
          current_tag=${EVENT_TAG:-${INPUT_TAG:-}}
          if [[ ! "${current_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "current release tag is not valid SemVer: ${current_tag}" >&2
            exit 2
          fi
          gh release view "${current_tag}" --json isDraft --jq \
            'select(.isDraft == false) | true' | grep -qx true || {
              echo "current tag is not a published release" >&2
              exit 2
            }
          previous_tag=
          found_current=false
          while IFS= read -r candidate; do
            if [[ "${candidate}" == "${current_tag}" ]]; then
              found_current=true
              continue
            fi
            if [[ "${found_current}" == true ]] && \
               [[ "${candidate}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              previous_tag=${candidate}
              break
            fi
          done < <(gh release list --limit 100 --exclude-drafts --json tagName \
            --jq '.[].tagName')
          if [[ "${found_current}" != true ]]; then
            echo "current tag is not present in the published release list" >&2
            exit 2
          fi
          printf 'current_tag=%s\n' "${current_tag}" >> "${GITHUB_OUTPUT}"
          printf 'current_version=%s\n' "${current_tag#v}" >> "${GITHUB_OUTPUT}"
          if [[ -z "${previous_tag}" ]]; then
            printf 'has_previous=false\n' >> "${GITHUB_OUTPUT}"
            printf '### Agent adjacent release matrix\n\n%s\n' \
              "${current_tag} is the first published baseline; no previous release exists." \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          printf 'has_previous=true\n' >> "${GITHUB_OUTPUT}"
          printf 'previous_tag=%s\n' "${previous_tag}" >> "${GITHUB_OUTPUT}"
          printf 'previous_version=%s\n' "${previous_tag#v}" >> "${GITHUB_OUTPUT}"
      - name: Install fixed Cosign release
        if: steps.releases.outputs.has_previous == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Download exact signed release assets
        if: steps.releases.outputs.has_previous == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.releases.outputs.current_tag }}
          PREVIOUS_TAG: ${{ steps.releases.outputs.previous_tag }}
          CURRENT_VERSION: ${{ steps.releases.outputs.current_version }}
          PREVIOUS_VERSION: ${{ steps.releases.outputs.previous_version }}
        run: |
          set -euo pipefail
          mkdir -p compatibility/current compatibility/previous
          gh release download "${CURRENT_TAG}" --dir compatibility/current \
            --pattern "owndock-agent_${CURRENT_VERSION}_linux_amd64.tar.gz" \
            --pattern "owndock-agent_${CURRENT_VERSION}_linux_arm64.tar.gz" \
            --pattern RELEASE.txt --pattern SHA256SUMS \
            --pattern SHA256SUMS.sigstore.json \
            --pattern verify-owndock-agent-release
          gh release download "${PREVIOUS_TAG}" --dir compatibility/previous \
            --pattern "owndock-agent_${PREVIOUS_VERSION}_linux_amd64.tar.gz" \
            --pattern "owndock-agent_${PREVIOUS_VERSION}_linux_arm64.tar.gz" \
            --pattern RELEASE.txt --pattern SHA256SUMS \
            --pattern SHA256SUMS.sigstore.json \
            --pattern verify-owndock-agent-release
      - name: Verify both release identities and architectures
        if: steps.releases.outputs.has_previous == 'true'
        env:
          CURRENT_VERSION: ${{ steps.releases.outputs.current_version }}
          PREVIOUS_VERSION: ${{ steps.releases.outputs.previous_version }}
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            packaging/release/verify-agent-release \
              "${CURRENT_VERSION}" \
              "compatibility/current/owndock-agent_${CURRENT_VERSION}_linux_${architecture}.tar.gz" \
              compatibility/current/SHA256SUMS \
              compatibility/current/SHA256SUMS.sigstore.json
            packaging/release/verify-agent-release \
              "${PREVIOUS_VERSION}" \
              "compatibility/previous/owndock-agent_${PREVIOUS_VERSION}_linux_${architecture}.tar.gz" \
              compatibility/previous/SHA256SUMS \
              compatibility/previous/SHA256SUMS.sigstore.json
          done
          (cd compatibility/current && sha256sum -c SHA256SUMS)
          (cd compatibility/previous && sha256sum -c SHA256SUMS)
      - name: Exercise adjacent amd64 install, upgrade, and rollback
        if: steps.releases.outputs.has_previous == 'true'
        env:
          CURRENT_TAG: ${{ steps.releases.outputs.current_tag }}
          PREVIOUS_TAG: ${{ steps.releases.outputs.previous_tag }}
          CURRENT_VERSION: ${{ steps.releases.outputs.current_version }}
          PREVIOUS_VERSION: ${{ steps.releases.outputs.previous_version }}
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d /tmp/owndock-agent-adjacent.XXXXXX)
          cleanup() { rm -rf "${root}"; }
          trap cleanup EXIT
          mkdir -p compatibility/current/extracted compatibility/previous/extracted
          tar -xzf \
            "compatibility/previous/owndock-agent_${PREVIOUS_VERSION}_linux_amd64.tar.gz" \
            -C compatibility/previous/extracted
          tar -xzf \
            "compatibility/current/owndock-agent_${CURRENT_VERSION}_linux_amd64.tar.gz" \
            -C compatibility/current/extracted
          previous_package="compatibility/previous/extracted/owndock-agent_${PREVIOUS_VERSION}_linux_amd64"
          current_package="compatibility/current/extracted/owndock-agent_${CURRENT_VERSION}_linux_amd64"
          export OWNDOCK_AGENT_INSTALL_ROOT=${root}
          export OWNDOCK_AGENT_OFFLINE=1
          "${previous_package}/owndock-agentctl" install
          printf '%s\n' preserved-across-adjacent-release \
            > "${root}/var/lib/owndock-agent/compatibility-state"
          "${current_package}/owndock-agentctl" install
          [[ "$(readlink "${root}/opt/owndock-agent/current")" == \
              "releases/${CURRENT_VERSION}" ]]
          "${root}/usr/local/sbin/owndock-agentctl" rollback \
            --version "${PREVIOUS_VERSION}"
          [[ "$(readlink "${root}/opt/owndock-agent/current")" == \
              "releases/${PREVIOUS_VERSION}" ]]
          [[ "$(<"${root}/var/lib/owndock-agent/compatibility-state")" == \
              preserved-across-adjacent-release ]]
          {
            printf '### Agent adjacent release matrix\n\n'
            printf -- '- Previous: `%s`\n' "${PREVIOUS_TAG}"
            printf -- '- Current: `%s`\n' "${CURRENT_TAG}"
            printf -- '- Signatures: both architectures verified\n'
            printf -- '- Lifecycle: previous install → current upgrade → previous rollback passed\n'
            printf -- '- Protocol: live mixed-version conformance remains a separate required gate\n'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.releases.outputs.has_previous == 'true'
        with:
          go-version: 1.26.5
          cache: true
      - name: Exercise adjacent live mTLS control streams
        if: steps.releases.outputs.has_previous == 'true'
        env:
          CURRENT_TAG: ${{ steps.releases.outputs.current_tag }}
          PREVIOUS_TAG: ${{ steps.releases.outputs.previous_tag }}
          CURRENT_VERSION: ${{ steps.releases.outputs.current_version }}
          PREVIOUS_VERSION: ${{ steps.releases.outputs.previous_version }}
        shell: bash
        run: |
          set -euo pipefail
          current_commit=$(awk -F= '$1 == "git_commit" { print $2 }' \
            compatibility/current/RELEASE.txt)
          previous_commit=$(awk -F= '$1 == "git_commit" { print $2 }' \
            compatibility/previous/RELEASE.txt)
          [[ "${current_commit}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${previous_commit}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse "${CURRENT_TAG}^{commit}")" == "${current_commit}" ]]
          [[ "$(git rev-parse "${PREVIOUS_TAG}^{commit}")" == "${previous_commit}" ]]

          source_root=$(mktemp -d /tmp/owndock-agent-source.XXXXXX)
          cleanup_sources() {
            git worktree remove --force "${source_root}/current" >/dev/null 2>&1 || true
            git worktree remove --force "${source_root}/previous" >/dev/null 2>&1 || true
            rm -rf "${source_root}"
          }
          trap cleanup_sources EXIT
          git worktree add --detach "${source_root}/current" "${current_commit}"
          git worktree add --detach "${source_root}/previous" "${previous_commit}"
          (cd "${source_root}/current" && \
            go build -trimpath -o "${source_root}/current-conformance" \
              ./internal/tools/agentconformance)
          (cd "${source_root}/previous" && \
            go build -trimpath -o "${source_root}/previous-conformance" \
              ./internal/tools/agentconformance)

          current_agent="compatibility/current/extracted/owndock-agent_${CURRENT_VERSION}_linux_amd64/owndock-agent"
          previous_agent="compatibility/previous/extracted/owndock-agent_${PREVIOUS_VERSION}_linux_amd64/owndock-agent"
          packaging/agent/control_process_integration_test.sh \
            "${previous_agent}" \
            "${source_root}/previous-conformance" \
            "${source_root}/current-conformance"
          packaging/agent/control_process_integration_test.sh \
            "${current_agent}" \
            "${source_root}/current-conformance" \
            "${source_root}/previous-conformance"
          {
            printf -- '- Live control: previous Agent → current fixture passed\n'
            printf -- '- Live control: current Agent → previous fixture passed\n'
            printf -- '- Network recovery: both directions reconnected after listener restart\n'
          } >> "${GITHUB_STEP_SUMMARY}"
