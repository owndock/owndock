components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller-provided request correlation identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]+$"
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ApplicationID:
      name: application_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DeploymentID:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RuntimeTargetID:
      name: runtime_target_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ManagedHostID:
      name: managed_host_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  headers:
    RequestID:
      description: Request correlation identifier accepted from or generated by OwnDock.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]+$"
  responses:
    HealthOK:
      description: Process is healthy.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    NotReady:
      description: Process is not ready to serve traffic.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    Version:
      description: Service prepare information.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Version"
    Credentials:
      description: Bearer credentials issued.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Credentials"
    CurrentIdentity:
      description: Current authenticated identity.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IdentityUser"
    ProjectList:
      description: Project collection.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
