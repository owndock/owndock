    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/RuntimeTargetID"
    delete:
      tags: [Runtime Targets]
      operationId: deleteRuntimeTarget
      summary: Retire a runtime target and its managed runtime resources
      description: The first request atomically moves the target to retiring so new deployments and container terminal access are rejected, and persists the initiating audit context. A 202 response means the Server has accepted the durable retirement workflow and will continue it in the background; client retries are optional. The workflow closes active container terminal sessions, removes rebuildable Runtime Inventory state, drains deployment commands, removes exact stable runtime resources, releases Agent cutover watermarks, deletes target metadata, and records the final audit event. Repeating a completed deletion is idempotent.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Durable retirement is fenced and will continue in the background while deployment workers drain.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [retiring]
        "204":
          description: Runtime target and managed runtime resources are deleted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
