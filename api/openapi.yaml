      description: Viewer, Developer, Maintainer, or Owner. OwnDock reads the immutable OCI manifest by descriptor digest, verifies its Artifact subject, media type, size and layer digest, validates the supported document schema, and only then returns the JSON attachment. This verifies storage integrity; an unverified provenance record is not presented as cryptographically signed.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ArtifactEvidenceContentResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
