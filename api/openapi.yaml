openapi: 3.0.3
info:
  title: OwnDock API
  version: 0.1.0
  description: Pre-release browser and management HTTP contract. Identity, Managed Host and Agent enrollment, Project-scoped Application, Release, Registry Credential, Environment, Runtime Target, Deployment lifecycle, and Audit operations form the implemented product slice when product mode is enabled. The separate mTLS Agent Control v1 transport is documented outside this OpenAPI; its typed commands, Agent Runtime Gateway, Git-to-Deploy, Terminal, and Template are not public management operations yet. Top-level Application, Environment, and Deployment operations remain disabled engineering samples.
  x-owndock-stability: pre-release
servers:
  - url: /
tags:
  - name: Health
  - name: Meta
  - name: Identity
  - name: Projects
  - name: Product Applications
  - name: Releases
  - name: Managed Hosts
  - name: Runtime Targets
  - name: Registry Credentials
  - name: Audit
  - name: Applications
  - name: Environments
  - name: Deployments
paths:
  /livez:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the process is alive
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
  /readyz:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether the process is ready to serve traffic
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/meta/version:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Meta]
      operationId: getVersion
      summary: Get service prepare information
      responses:
        "200":
          $ref: "#/components/responses/Version"
  /api/v1/managed-hosts:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Managed Hosts]
      operationId: listManagedHosts
      summary: List Organization-owned managed hosts
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ManagedHostList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Managed Hosts]
      operationId: createManagedHost
      summary: Register an Organization-owned managed host
      description: Only an Owner may register a host. Agent hosts remain enrolling until the separate enrollment flow creates a fixed Agent identity, then remain offline until the future authenticated control flow establishes liveness.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManagedHostRequest"
      responses:
        "201":
          $ref: "#/components/responses/ManagedHostCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/managed-hosts/{managed_host_id}:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ManagedHostID"
    get:
      tags: [Managed Hosts]
      operationId: getManagedHost
      summary: Get an Organization-owned managed host
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ManagedHostResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/managed-hosts/{managed_host_id}:disable:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ManagedHostID"
    post:
      tags: [Managed Hosts]
      operationId: disableManagedHost
      summary: Disable a managed host and revoke its active Agent identity
      description: Only an Owner may disable a Host. Any unused enrollment credentials are expired in the same transaction.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ManagedHostResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/managed-hosts/{managed_host_id}/enrollments:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ManagedHostID"
    post:
      tags: [Managed Hosts]
      operationId: createAgentEnrollment
      summary: Create a one-time Agent enrollment credential
      description: Only an Owner may create an enrollment. The raw token is returned once and only its SHA-256 hash is persisted. Creating a new credential expires any previous unused credential for the Host.
      security:
        - bearerAuth: []
      responses:
        "201":
          $ref: "#/components/responses/AgentEnrollmentCreated"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/agent/enrollments:exchange:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Managed Hosts]
      operationId: exchangeAgentEnrollment
      summary: Exchange a one-time enrollment token and CSR for an Agent certificate
      description: This bootstrap endpoint does not accept a user session. The enrollment token is carried only in the JSON body, is consumed atomically, and cannot be replayed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeAgentEnrollmentRequest"
      responses:
        "201":
          $ref: "#/components/responses/AgentCredentialsCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/bootstrap:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Identity]
      operationId: bootstrapIdentity
      summary: Initialize the first organization and owner
      parameters:
        - name: X-OwnDock-Bootstrap-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          $ref: "#/components/responses/Credentials"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/login:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Identity]
      operationId: login
      summary: Create a local bearer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/Credentials"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/me:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Identity]
      operationId: getCurrentIdentity
      summary: Get the current authenticated identity
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/CurrentIdentity"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/logout:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Identity]
      operationId: logout
      summary: Revoke the current bearer session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "401":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects in the current organization
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ProjectList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNamedResourceRequest"
      responses:
        "201":
          $ref: "#/components/responses/ProjectCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/applications:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Product Applications]
      operationId: listProjectApplications
      summary: List applications in a project
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ProductApplicationList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Product Applications]
      operationId: createProjectApplication
      summary: Create an application in a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNamedResourceRequest"
      responses:
        "201":
          $ref: "#/components/responses/ProductApplicationCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/applications/{application_id}/releases:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ApplicationID"
    get:
      tags: [Releases]
      operationId: listReleases
      summary: List immutable releases for an application
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ReleaseList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Releases]
      operationId: createRelease
      summary: Create an immutable digest-pinned release
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseRequest"
      responses:
        "201":
          $ref: "#/components/responses/ReleaseCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/runtime-targets:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Runtime Targets]
      operationId: listRuntimeTargets
      summary: List Docker runtime targets in a project
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/RuntimeTargetList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Runtime Targets]
      operationId: createRuntimeTarget
      summary: Register a Docker runtime target on a managed host
      description: The connection mode must match the Organization-owned Managed Host. Direct mode requires the protected Docker endpoint fields. Agent mode forbids direct connection fields. Agent enrollment is implemented, but an Agent target cannot be probed or deployed until the authenticated control flow and Agent Runtime Gateway are implemented.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuntimeTargetRequest"
      responses:
        "201":
          $ref: "#/components/responses/RuntimeTargetCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/runtime-targets/{runtime_target_id}/probe:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/RuntimeTargetID"
    post:
      tags: [Runtime Targets]
      operationId: probeRuntimeTarget
      summary: Probe a runtime target using its external TLS credential
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/RuntimeTargetResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/registry-credentials:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Registry Credentials]
      operationId: listRegistryCredentials
      summary: List external registry credentials in a project
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/RegistryCredentialList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Registry Credentials]
      operationId: createRegistryCredential
      summary: Register private registry metadata backed by an external secret
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistryCredentialRequest"
      responses:
        "201":
          $ref: "#/components/responses/RegistryCredentialCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/environments:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Environments]
      operationId: listProjectEnvironments
      summary: List logical environments in a project
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ProjectEnvironmentList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Environments]
      operationId: createProjectEnvironment
      summary: Create a logical environment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectEnvironmentRequest"
      responses:
        "201":
          $ref: "#/components/responses/ProjectEnvironmentCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/deployments:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Deployments]
      operationId: listProjectDeployments
      summary: List deployments in a project
      security:
        - bearerAuth: []
      parameters:
        - name: application_id
          in: query
          schema:
            type: string
        - name: environment_id
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ProjectDeploymentList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Deployments]
      operationId: createProjectDeployment
      summary: Create an immutable deployment operation
      description: The selected runtime target must have completed a successful probe and be in the ready state. Otherwise the API returns 409 with code runtime_target_not_ready.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectDeploymentRequest"
      responses:
        "201":
          $ref: "#/components/responses/ProjectDeploymentCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/deployments/{deployment_id}:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/DeploymentID"
    get:
      tags: [Deployments]
      operationId: getProjectDeployment
      summary: Get a deployment
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ProjectDeploymentResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/deployments/{deployment_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/DeploymentID"
    post:
      tags: [Deployments]
      operationId: cancelProjectDeployment
      summary: Request deployment cancellation
      security:
        - bearerAuth: []
      responses:
        "202":
          $ref: "#/components/responses/ProjectDeploymentResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/deployments/{deployment_id}/retry:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/DeploymentID"
    post:
      tags: [Deployments]
      operationId: retryProjectDeployment
      summary: Retry a failed deployment as a new operation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          $ref: "#/components/responses/ProjectDeploymentCreated"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/deployments/{deployment_id}/rollback:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/DeploymentID"
    post:
      tags: [Deployments]
      operationId: rollbackProjectDeployment
      summary: Deploy a previously successful release as a new rollback operation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRollbackDeploymentRequest"
      responses:
