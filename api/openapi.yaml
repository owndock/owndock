components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque user session token sent explicitly in Authorization. The REST API does not authenticate user cookies.
    terminalTicket:
      type: apiKey
      in: cookie
      name: __Secure-owndock_terminal_ticket
      description: Short-lived, one-time terminal ticket scoped to the exact connect path. It is never returned in JSON or accepted in the URL.
    buildTriggerAuth:
      type: http
      scheme: bearer
      bearerFormat: OwnDock-Build-Trigger
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller-provided request correlation identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]+$"
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SourceRepositoryID:
      name: source_repository_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BuildConfigurationID:
      name: build_configuration_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BuildID:
      name: build_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BuildTriggerID:
      name: build_trigger_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BuildHookID:
      name: build_hook_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    WebhookProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [github, gitlab, gitea, forgejo]
    ApplicationID:
      name: application_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TemplateID:
      name: template_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 80
    DeploymentID:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RuntimeTargetID:
      name: runtime_target_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ManagedHostID:
      name: managed_host_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TerminalSessionID:
      name: terminal_session_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    InventoryRuntimeTargetID:
      name: runtime_target_id
      in: query
      required: false
      description: Restrict results to one registered runtime target.
      schema:
        type: string
        minLength: 1
        maxLength: 160
    InventoryKind:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum: [container, image, network, volume]
    InventoryIncludeAbsent:
      name: include_absent
      in: query
      required: false
      description: Include resources recently confirmed absent. They are retained for a bounded explanation window.
      schema:
        type: boolean
        default: false
    InventoryLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    InventoryCursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor returned by the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  headers:
    RequestID:
      description: Request correlation identifier accepted from or generated by OwnDock.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]+$"
  responses:
    HealthOK:
      description: Process is healthy.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    NotReady:
      description: Process is not ready to serve traffic.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    Version:
      description: Service prepare information.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Version"
    Credentials:
      description: Bearer credentials issued.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Credentials"
    CurrentIdentity:
      description: Current authenticated identity.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IdentityUser"
    SessionList:
      description: Active session metadata. No bearer token or token hash is returned and the response is no-store.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
    AdminSessionRevocation:
      description: Number of sessions removed by an Owner emergency action. The response is no-store.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [revoked_sessions]
            properties:
              revoked_sessions:
                type: integer
                format: int64
                minimum: 0
    IngressRateLimited:
      description: The trusted client source or installation-wide Product API limit was exceeded.
      headers:
        Retry-After:
          description: Seconds until this fixed admission window can accept another request.
          schema:
            type: integer
            minimum: 1
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IngressProtectionUnavailable:
      description: Shared ingress admission could not be safely evaluated; the request failed closed.
      headers:
        Retry-After:
          description: Minimum seconds before retrying.
          schema:
            type: integer
            minimum: 1
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    OrganizationUserList:
      description: Safe Organization user metadata. Password and token material is excluded.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationUser"
    UserInvitationList:
      description: Safe Organization invitation metadata without token or token hash.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/UserInvitation"
    UserInvitationCreated:
      description: Invitation metadata and its one-time plaintext token. The response must not be cached.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserInvitationCredential"
    UserInvitationResponse:
      description: Safe invitation metadata without token or token hash.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserInvitation"
    ProjectList:
      description: Project collection.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    ProjectCreated:
      description: Project created.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Project"
    ProjectMemberList:
      description: Explicit Project membership collection. Organization Owner is implicit and omitted.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
