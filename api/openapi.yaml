  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
    Version:
      type: object
      additionalProperties: false
      required: [service, version, commit, build_time, go_version]
      properties:
        service:
          type: string
        version:
          type: string
        commit:
          type: string
        build_time:
          type: string
        go_version:
          type: string
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [organization_name, email, password]
      properties:
        organization_name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    Credentials:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
          minLength: 32
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/IdentityUser"
        organization:
          $ref: "#/components/schemas/Organization"
    IdentityUser:
      type: object
      additionalProperties: false
      required: [id, organization_id, email, role]
      properties:
        id:
          type: string
          minLength: 1
        organization_id:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, maintainer, developer, viewer]
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, created_at, expires_at, current]
      properties:
        id:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
    Organization:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
    Project:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, created_by, created_at]
      properties:
        id:
          type: string
          minLength: 1
        organization_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    ProductApplication:
      type: object
      additionalProperties: false
      required: [id, project_id, name, created_by, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    Release:
      type: object
      additionalProperties: false
      required: [id, project_id, application_id, image_digest, runtime_spec, created_by, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        application_id:
          type: string
          minLength: 1
        image_digest:
          type: string
          pattern: "^.+@sha256:[a-f0-9]{64}$"
        registry_credential_id:
          type: string
          minLength: 1
        runtime_spec:
          $ref: "#/components/schemas/ReleaseRuntimeSpec"
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    RegistryCredential:
      type: object
      additionalProperties: false
      required: [id, project_id, name, server, username, password_ref, created_by, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        server:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
          maxLength: 255
        password_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    RepositoryCredential:
      type: object
      additionalProperties: false
      required: [id, project_id, name, type, secret_configured, version, created_by, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [ssh_deploy_key, https_access_token]
        username:
          type: string
          maxLength: 128
        secret_configured:
          type: boolean
          readOnly: true
        public_key_fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
        version:
          type: integer
          format: int64
          minimum: 1
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    SourceRepository:
      type: object
      additionalProperties: false
      required: [id, project_id, name, repository_url, protocol, default_branch, status, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        repository_url:
          type: string
          minLength: 1
          maxLength: 2048
          description: Credential-free HTTPS, ssh://, or git@host:path repository address.
        protocol:
          type: string
          enum: [https, ssh]
          readOnly: true
        default_branch:
          type: string
          minLength: 1
          maxLength: 255
        credential_id:
          type: string
          minLength: 1
        ssh_host_key_fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
        status:
          type: string
          enum: [pending, ready, unreachable, authentication_error, host_key_mismatch, reference_not_found]
          readOnly: true
        last_probed_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReleaseRuntimeSpec:
      type: object
      additionalProperties: false
      required: [ports, environment_keys, resources]
      properties:
        ports:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/ReleasePort"
        environment_keys:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        resources:
          $ref: "#/components/schemas/ReleaseResources"
        health_check:
          $ref: "#/components/schemas/ReleaseHealthCheck"
    ReleasePort:
      type: object
      additionalProperties: false
      required: [name, container_port, protocol]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,30}$"
        container_port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [tcp, udp]
    ReleaseResources:
      type: object
      additionalProperties: false
      required: [cpu_milli, memory_bytes]
      properties:
        cpu_milli:
          type: integer
          minimum: 10
          maximum: 64000
        memory_bytes:
          type: integer
          format: int64
          minimum: 16777216
          maximum: 1099511627776
    ReleaseHealthCheck:
      type: object
      additionalProperties: false
      required: [command, interval_seconds, timeout_seconds, retries, start_period_seconds]
      properties:
        command:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 1024
        interval_seconds:
          type: integer
          minimum: 1
          maximum: 300
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
        retries:
          type: integer
          minimum: 1
          maximum: 10
        start_period_seconds:
          type: integer
          minimum: 0
          maximum: 600
    ManagedHost:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, status, connection_mode, capabilities, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 1
        organization_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        status:
          type: string
          enum: [enrolling, online, offline, disabled]
        connection_mode:
          type: string
          enum: [agent, direct]
        agent_identity_id:
          type: string
          minLength: 1
          readOnly: true
        agent_instance_id:
          type: string
          minLength: 1
          maxLength: 128
          readOnly: true
        agent_certificate_expires_at:
          type: string
          format: date-time
          readOnly: true
        direct_ssh_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
        last_seen_at:
          type: string
          format: date-time
        agent_version:
          type: string
          minLength: 1
        protocol_version:
          type: string
          minLength: 1
        capabilities:
          type: array
          items:
            type: string
            minLength: 1
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentEnrollmentCredential:
      type: object
      additionalProperties: false
      required: [enrollment_id, managed_host_id, enrollment_token, expires_at]
      properties:
        enrollment_id:
          type: string
          minLength: 1
        managed_host_id:
          type: string
          minLength: 1
        enrollment_token:
          type: string
          minLength: 32
          readOnly: true
        expires_at:
          type: string
          format: date-time
    ExchangeAgentEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [enrollment_token, instance_id, agent_version, protocol_version, capabilities, csr_pem]
      properties:
        enrollment_token:
          type: string
          minLength: 32
          writeOnly: true
        instance_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_-][A-Za-z0-9._-]*$"
        agent_version:
          type: string
          minLength: 1
          maxLength: 64
        protocol_version:
          type: string
          minLength: 1
          maxLength: 64
        capabilities:
          description: Capabilities approved for this Agent Identity. A later authenticated hello may advertise only a subset of this grant.
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
        csr_pem:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
    AgentCredentials:
      type: object
      additionalProperties: false
      required: [agent_identity_id, managed_host_id, certificate_pem, ca_certificate_pem, certificate_expires_at]
      properties:
        agent_identity_id:
          type: string
          minLength: 1
        managed_host_id:
          type: string
          minLength: 1
        certificate_pem:
          type: string
          minLength: 1
          readOnly: true
        ca_certificate_pem:
          type: string
          minLength: 1
          readOnly: true
        certificate_expires_at:
          type: string
          format: date-time
    RuntimeTarget:
      type: object
      additionalProperties: false
      required: [id, project_id, name, managed_host_id, connection_mode, status, created_by, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        managed_host_id:
          type: string
          minLength: 1
        connection_mode:
          type: string
          enum: [agent, direct]
        endpoint:
          type: string
          pattern: "^tcp://.+:[0-9]+$"
        tls_server_name:
          type: string
          minLength: 1
        credential_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
        status:
          type: string
          enum: [pending, ready, unreachable, credential_error]
        last_probed_at:
          type: string
          format: date-time
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, organization_id, actor_id, action, resource_type, resource_id, created_at]
      properties:
        id:
          type: string
          minLength: 1
        organization_id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        actor_id:
          type: string
          minLength: 1
        action:
          type: string
          minLength: 1
        resource_type:
          type: string
          minLength: 1
        resource_id:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    CreateNamedResourceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
    CreateReleaseRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
          pattern: "^.+@sha256:[a-f0-9]{64}$"
        registry_credential_id:
          type: string
          minLength: 1
        runtime_spec:
          $ref: "#/components/schemas/ReleaseRuntimeSpec"
    CreateRegistryCredentialRequest:
      type: object
      additionalProperties: false
      required: [name, server, username, password_ref]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        server:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
          maxLength: 255
        password_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
    CreateRepositoryCredentialRequest:
      type: object
      additionalProperties: false
      required: [name, type, secret_ref]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [ssh_deploy_key, https_access_token]
        username:
          type: string
          maxLength: 128
        secret_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
          writeOnly: true
        public_key_fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
    CreateSourceRepositoryRequest:
      type: object
      additionalProperties: false
      required: [name, repository_url, default_branch]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        repository_url:
          type: string
          minLength: 1
          maxLength: 2048
        default_branch:
          type: string
          minLength: 1
          maxLength: 255
        credential_id:
          type: string
          minLength: 1
        ssh_host_key_fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
    CreateManagedHostRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateAgentManagedHostRequest"
        - $ref: "#/components/schemas/CreateDirectManagedHostRequest"
    CreateAgentManagedHostRequest:
      type: object
      additionalProperties: false
      required: [name, connection_mode]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        connection_mode:
          type: string
          enum: [agent]
    CreateDirectManagedHostRequest:
      type: object
      additionalProperties: false
      required: [name, connection_mode]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        connection_mode:
          type: string
          enum: [direct]
        direct_ssh_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
    CreateRuntimeTargetRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateAgentRuntimeTargetRequest"
        - $ref: "#/components/schemas/CreateDirectRuntimeTargetRequest"
    CreateAgentRuntimeTargetRequest:
      type: object
      additionalProperties: false
      required: [name, managed_host_id, connection_mode]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        managed_host_id:
          type: string
          minLength: 1
        connection_mode:
          type: string
          enum: [agent]
    CreateDirectRuntimeTargetRequest:
      type: object
      additionalProperties: false
      required: [name, managed_host_id, connection_mode, endpoint, tls_server_name, credential_ref]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        managed_host_id:
          type: string
          minLength: 1
        connection_mode:
          type: string
          enum: [direct]
        endpoint:
          type: string
          pattern: "^tcp://.+:[0-9]+$"
        tls_server_name:
          type: string
          minLength: 1
        credential_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
    Application:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum: [pending, ready, failed]
        created_at:
          type: string
          format: date-time
    Environment:
      type: object
      additionalProperties: false
      required: [id, name, provider, status, created_at]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        provider:
          type: string
          minLength: 1
        status:
          type: string
          enum: [active, draining, deleted]
        created_at:
          type: string
          format: date-time
    ProjectEnvironment:
      type: object
      additionalProperties: false
      required: [id, project_id, name, stage, variables, created_by, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        stage:
          type: string
          enum: [development, staging, production]
        variables:
          type: object
          additionalProperties:
            type: string
            maxLength: 4096
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    ProjectDeployment:
      type: object
      additionalProperties: false
      required: [id, project_id, release_id, application_id, environment_id, runtime_target_id, operation, status, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        release_id:
          type: string
          minLength: 1
        application_id:
          type: string
          minLength: 1
        environment_id:
          type: string
          minLength: 1
        runtime_target_id:
          type: string
          minLength: 1
        operation:
          type: string
          enum: [deploy, retry, rollback]
