          pattern: '^sha256:[0-9a-f]{64}$'
        trusted_root_id:
          type: string
          minLength: 1
        trusted_root_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        certificate_identity:
          type: string
          minLength: 1
          maxLength: 1024
        oidc_issuer:
          type: string
          format: uri
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SignatureSigningProfileRequest:
      type: object
