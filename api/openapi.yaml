          schema:
            $ref: "#/components/schemas/ProductApplication"
    TemplateList:
      description: Immutable built-in Template collection.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
