      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/Environment"
    EnvironmentCreated:
      description: Environment created.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Environment"
    DeploymentList:
      description: Deployment collection.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/Deployment"
    DeploymentCreated:
      description: Deployment created.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Deployment"
    APIError:
      description: Request failed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
    Version:
      type: object
      additionalProperties: false
      required: [service, version, commit, build_time, go_version]
      properties:
        service:
          type: string
        version:
          type: string
        commit:
          type: string
        build_time:
          type: string
        go_version:
          type: string
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [organization_name, email, password]
      properties:
        organization_name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    Credentials:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
          minLength: 32
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/IdentityUser"
        organization:
          $ref: "#/components/schemas/Organization"
    IdentityUser:
      type: object
      additionalProperties: false
      required: [id, organization_id, email, role]
      properties:
        id:
          type: string
          minLength: 1
        organization_id:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, maintainer, developer, viewer]
    Organization:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
    Project:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, created_by, created_at]
      properties:
        id:
          type: string
          minLength: 1
        organization_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    ProductApplication:
      type: object
      additionalProperties: false
      required: [id, project_id, name, created_by, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    Release:
      type: object
      additionalProperties: false
      required: [id, project_id, application_id, image_digest, runtime_spec, created_by, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        application_id:
          type: string
          minLength: 1
        image_digest:
          type: string
          pattern: "^.+@sha256:[a-f0-9]{64}$"
        registry_credential_id:
          type: string
          minLength: 1
        runtime_spec:
          $ref: "#/components/schemas/ReleaseRuntimeSpec"
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    RegistryCredential:
      type: object
      additionalProperties: false
      required: [id, project_id, name, server, username, password_ref, created_by, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        server:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
          maxLength: 255
        password_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    ReleaseRuntimeSpec:
      type: object
      additionalProperties: false
      required: [ports, environment_keys, resources]
      properties:
        ports:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/ReleasePort"
        environment_keys:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        resources:
          $ref: "#/components/schemas/ReleaseResources"
        health_check:
          $ref: "#/components/schemas/ReleaseHealthCheck"
    ReleasePort:
      type: object
      additionalProperties: false
      required: [name, container_port, protocol]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,30}$"
        container_port:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [tcp, udp]
    ReleaseResources:
      type: object
      additionalProperties: false
      required: [cpu_milli, memory_bytes]
      properties:
        cpu_milli:
          type: integer
          minimum: 10
          maximum: 64000
        memory_bytes:
          type: integer
          format: int64
          minimum: 16777216
          maximum: 1099511627776
    ReleaseHealthCheck:
      type: object
      additionalProperties: false
      required: [command, interval_seconds, timeout_seconds, retries, start_period_seconds]
      properties:
        command:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 1024
        interval_seconds:
          type: integer
          minimum: 1
          maximum: 300
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
        retries:
          type: integer
          minimum: 1
          maximum: 10
        start_period_seconds:
          type: integer
          minimum: 0
          maximum: 600
    ManagedHost:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, status, connection_mode, capabilities, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 1
        organization_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        status:
          type: string
          enum: [enrolling, online, offline, disabled]
        connection_mode:
          type: string
          enum: [agent, direct]
        agent_identity_id:
          type: string
          minLength: 1
          readOnly: true
        agent_instance_id:
          type: string
          minLength: 1
          maxLength: 128
          readOnly: true
        agent_certificate_expires_at:
          type: string
          format: date-time
          readOnly: true
        direct_ssh_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
        last_seen_at:
          type: string
          format: date-time
        agent_version:
          type: string
          minLength: 1
        protocol_version:
          type: string
          minLength: 1
        capabilities:
          type: array
          items:
            type: string
            minLength: 1
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentEnrollmentCredential:
      type: object
      additionalProperties: false
      required: [enrollment_id, managed_host_id, enrollment_token, expires_at]
      properties:
        enrollment_id:
          type: string
          minLength: 1
        managed_host_id:
          type: string
          minLength: 1
        enrollment_token:
          type: string
          minLength: 32
          readOnly: true
        expires_at:
          type: string
          format: date-time
    ExchangeAgentEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [enrollment_token, instance_id, agent_version, protocol_version, capabilities, csr_pem]
      properties:
        enrollment_token:
          type: string
          minLength: 32
          writeOnly: true
        instance_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_-][A-Za-z0-9._-]*$"
        agent_version:
          type: string
          minLength: 1
          maxLength: 64
        protocol_version:
          type: string
          minLength: 1
          maxLength: 64
        capabilities:
          type: array
          maxItems: 16
          uniqueItems: true
