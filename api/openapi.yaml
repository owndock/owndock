          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectMember"
    ProductApplicationList:
      description: Project application collection.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/ProductApplication"
    ProductApplicationCreated:
      description: Project application created.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
