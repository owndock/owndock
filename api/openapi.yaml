openapi: 3.0.3
info:
  title: OwnDock API
  version: 0.1.0
  description: Pre-release browser and management HTTP contract. Identity, Managed Host and Agent enrollment, Project-scoped Application, Release, Registry Credential, Source Repository connection, Environment, Runtime Target, Deployment lifecycle, Runtime Inventory, and Audit operations form the implemented product slice when product mode is enabled. The separate mTLS Agent Control v1 transport is documented outside this OpenAPI; its typed commands and Agent Runtime Gateway are internal transports. Build execution, Webhook, Terminal, and Template operations are not public management operations yet. Top-level Application, Environment, and Deployment operations remain disabled engineering samples.
  x-owndock-stability: pre-release
servers:
  - url: /
tags:
  - name: Health
  - name: Meta
  - name: Identity
  - name: Projects
  - name: Product Applications
  - name: Releases
  - name: Managed Hosts
  - name: Runtime Targets
  - name: Runtime Inventory
  - name: Registry Credentials
  - name: Source Repositories
  - name: Audit
  - name: Applications
  - name: Environments
  - name: Deployments
paths:
  /livez:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the process is alive
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
  /readyz:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether the process is ready to serve traffic
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/meta/version:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Meta]
      operationId: getVersion
      summary: Get service prepare information
      responses:
        "200":
          $ref: "#/components/responses/Version"
  /api/v1/managed-hosts:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Managed Hosts]
      operationId: listManagedHosts
      summary: List Organization-owned managed hosts
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ManagedHostList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Managed Hosts]
      operationId: createManagedHost
      summary: Register an Organization-owned managed host
      description: Only an Owner may register a host. Agent hosts remain enrolling until the separate enrollment flow creates a fixed Agent identity, then remain offline until the authenticated Agent Control flow establishes liveness.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManagedHostRequest"
      responses:
        "201":
          $ref: "#/components/responses/ManagedHostCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/managed-hosts/{managed_host_id}:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ManagedHostID"
    get:
      tags: [Managed Hosts]
      operationId: getManagedHost
      summary: Get an Organization-owned managed host
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ManagedHostResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/managed-hosts/{managed_host_id}/runtime-inventory:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ManagedHostID"
    get:
      tags: [Runtime Inventory]
      operationId: listHostRuntimeInventory
      summary: List safe runtime inventory for a managed host
      description: Owner and Maintainer only. Returns containers, images, networks, and volumes observed on this Organization-owned host. This permission does not grant terminal access. Callers cannot provide a Docker endpoint, object ID selector, or arbitrary Docker filter.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InventoryRuntimeTargetID"
        - $ref: "#/components/parameters/InventoryKind"
        - $ref: "#/components/parameters/InventoryIncludeAbsent"
        - $ref: "#/components/parameters/InventoryLimit"
        - $ref: "#/components/parameters/InventoryCursor"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeInventoryStatePage"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/managed-hosts/{managed_host_id}:disable:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ManagedHostID"
    post:
      tags: [Managed Hosts]
      operationId: disableManagedHost
      summary: Disable a managed host and revoke its active Agent identity
      description: Only an Owner may disable a Host. Any unused enrollment credentials are expired in the same transaction.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ManagedHostResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/managed-hosts/{managed_host_id}/enrollments:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ManagedHostID"
    post:
      tags: [Managed Hosts]
      operationId: createAgentEnrollment
      summary: Create a one-time Agent enrollment credential
      description: Only an Owner may create an enrollment. The raw token is returned once and only its SHA-256 hash is persisted. Creating a new credential expires any previous unused credential for the Host.
      security:
        - bearerAuth: []
      responses:
        "201":
          $ref: "#/components/responses/AgentEnrollmentCreated"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/agent/enrollments:exchange:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Managed Hosts]
      operationId: exchangeAgentEnrollment
      summary: Exchange a one-time enrollment token and CSR for an Agent certificate
      description: This bootstrap endpoint does not accept a user session. The enrollment token is carried only in the JSON body, is consumed atomically, and cannot be replayed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeAgentEnrollmentRequest"
      responses:
        "201":
          $ref: "#/components/responses/AgentCredentialsCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/bootstrap:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Identity]
      operationId: bootstrapIdentity
      summary: Initialize the first organization and owner
      parameters:
        - name: X-OwnDock-Bootstrap-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          $ref: "#/components/responses/Credentials"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/login:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Identity]
      operationId: login
      summary: Create a local bearer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/Credentials"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "429":
          description: Login attempt limit exceeded.
          headers:
            Retry-After:
              description: Seconds before another login attempt is allowed.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/me:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Identity]
      operationId: getCurrentIdentity
      summary: Get the current authenticated identity
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/CurrentIdentity"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/logout:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Identity]
      operationId: logout
      summary: Revoke the current bearer session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "401":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/sessions:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Identity]
      operationId: listCurrentUserSessions
      summary: List active sessions owned by the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/SessionList"
        "401":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    delete:
      tags: [Identity]
      operationId: revokeCurrentUserSession
      summary: Revoke one active session owned by the current user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "401":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects in the current organization
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ProjectList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNamedResourceRequest"
      responses:
        "201":
          $ref: "#/components/responses/ProjectCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/applications:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Product Applications]
      operationId: listProjectApplications
      summary: List applications in a project
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ProductApplicationList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Product Applications]
      operationId: createProjectApplication
      summary: Create an application in a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNamedResourceRequest"
      responses:
        "201":
          $ref: "#/components/responses/ProductApplicationCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/applications/{application_id}/releases:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ApplicationID"
    get:
      tags: [Releases]
      operationId: listReleases
      summary: List immutable releases for an application
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ReleaseList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Releases]
      operationId: createRelease
      summary: Create an immutable digest-pinned release
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseRequest"
      responses:
        "201":
          $ref: "#/components/responses/ReleaseCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/runtime-targets:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Runtime Targets]
      operationId: listRuntimeTargets
      summary: List Docker runtime targets in a project
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/RuntimeTargetList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Runtime Targets]
      operationId: createRuntimeTarget
      summary: Register a Docker runtime target on a managed host
      description: The connection mode must match the Organization-owned Managed Host. Direct mode requires the protected Docker endpoint fields. Agent mode forbids direct connection fields. When Agent Control is enabled, target probing and the two-phase Agent Deployment Gateway are registered together; offline Agent targets never fall back to direct mode.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuntimeTargetRequest"
      responses:
        "201":
          $ref: "#/components/responses/RuntimeTargetCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/runtime-targets/{runtime_target_id}/probe:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/RuntimeTargetID"
    post:
      tags: [Runtime Targets]
      operationId: probeRuntimeTarget
      summary: Probe a runtime target through its registered connection mode
      description: Direct mode resolves the external TLS credential and pings Docker Engine. Agent mode dispatches a typed runtime probe to the fixed Managed Host when Agent Control is enabled; the matching Agent Deployment Gateway is part of the same server composition, so a ready target has an executable deployment path.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/RuntimeTargetResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/registry-credentials:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Registry Credentials]
      operationId: listRegistryCredentials
      summary: List external registry credentials in a project
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/RegistryCredentialList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Registry Credentials]
      operationId: createRegistryCredential
      summary: Register private registry metadata backed by an external secret
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistryCredentialRequest"
      responses:
        "201":
          $ref: "#/components/responses/RegistryCredentialCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/repository-credentials:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Source Repositories]
      operationId: listRepositoryCredentials
      summary: List safe Git repository credential metadata
      description: The secret reference and secret material are never returned. secret_configured only confirms that a protected reference exists.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/RepositoryCredentialList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Source Repositories]
      operationId: createRepositoryCredential
      summary: Register Git read credential metadata backed by an external secret
      description: Owner or Maintainer only. SSH Deploy Key and HTTPS Access Token are supported. The response never echoes secret_ref.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepositoryCredentialRequest"
      responses:
        "201":
          $ref: "#/components/responses/RepositoryCredentialCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/source-repositories:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Source Repositories]
      operationId: listSourceRepositories
      summary: List approved Git repository connections
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/SourceRepositoryList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Source Repositories]
      operationId: createSourceRepository
      summary: Register an HTTPS or SSH Git repository connection
      description: Owner or Maintainer only. Credentials in repository_url, insecure Git protocols, local paths, queries, fragments, and unpinned SSH hosts are rejected. Creation does not fetch code or start a Build.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRepositoryRequest"
      responses:
        "201":
          $ref: "#/components/responses/SourceRepositoryCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/source-repositories/{source_repository_id}:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/SourceRepositoryID"
    get:
      tags: [Source Repositories]
      operationId: getSourceRepository
      summary: Get an approved Git repository connection
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/SourceRepositoryResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/source-repositories/{source_repository_id}/probe:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/SourceRepositoryID"
    post:
      tags: [Source Repositories]
      operationId: probeSourceRepository
      summary: Verify a Git repository connection and its default branch
      description: Owner or Maintainer only. Resolves the external credential only for this request, lists remote references without checking out source code, verifies normal HTTPS TLS or the pinned SSH host key, persists a safe status, and writes an audit event. It never returns the credential or raw transport error.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/SourceRepositoryResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/environments:
