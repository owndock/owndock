      required: [id, project_id, name, repository_url, protocol, default_branch, status, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        repository_url:
          type: string
          minLength: 1
          maxLength: 2048
          description: Credential-free HTTPS, ssh://, or git@host:path repository address.
        protocol:
          type: string
          enum: [https, ssh]
          readOnly: true
        default_branch:
          type: string
          minLength: 1
          maxLength: 255
        credential_id:
          type: string
          minLength: 1
        ssh_host_key_fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
        status:
          type: string
          enum: [pending, ready, unreachable, authentication_error, host_key_mismatch, reference_not_found]
          readOnly: true
        last_probed_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BuildResources:
      type: object
      additionalProperties: false
      required: [cpu_milli, memory_bytes, disk_bytes]
      properties:
        cpu_milli:
          type: integer
          format: int64
          minimum: 100
          maximum: 16000
        memory_bytes:
          type: integer
          format: int64
          minimum: 134217728
          maximum: 34359738368
        disk_bytes:
          type: integer
          format: int64
          minimum: 1073741824
          maximum: 214748364800
    AutomaticDeploymentRule:
      type: object
      additionalProperties: false
      required: [environment_id, runtime_target_id]
      properties:
        environment_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Must identify a development Environment in the same Project.
        runtime_target_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Must identify a Runtime Target in the same Project; it must be ready when the Deployment is created.
    BuildConfiguration:
      type: object
      additionalProperties: false
      required: [id, project_id, application_id, name, source_repository_id, dockerfile_path, context_path, allowed_refs, registry_credential_id, image_repository, target_platform, resources, timeout_seconds, max_concurrency, auto_create_release, release_runtime_spec, automatic_deployments, version, created_by, updated_by, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        application_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        source_repository_id:
          type: string
          minLength: 1
        dockerfile_path:
          type: string
          minLength: 1
          maxLength: 255
          description: Canonical repository-relative Dockerfile path within context_path.
        context_path:
          type: string
          minLength: 1
          maxLength: 255
          description: Canonical repository-relative directory, or a single dot for repository root.
        allowed_refs:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 12
            maxLength: 266
            pattern: '^refs/(heads|tags)/\S+$'
        registry_credential_id:
          type: string
          minLength: 1
        image_repository:
          type: string
          minLength: 1
          maxLength: 255
          description: Canonical OCI repository without a tag or digest.
        target_platform:
          type: string
          enum: [linux/amd64, linux/arm64]
        resources:
          $ref: "#/components/schemas/BuildResources"
        timeout_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 7200
        max_concurrency:
          type: integer
          minimum: 1
          maximum: 4
        auto_create_release:
          type: boolean
        release_runtime_spec:
          $ref: "#/components/schemas/ReleaseRuntimeSpec"
        automatic_deployments:
          type: array
          maxItems: 8
          description: Explicit development-only targets. An empty array keeps every Environment manual. Maintainer permission is required to change this list.
          items:
            $ref: "#/components/schemas/AutomaticDeploymentRule"
        version:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        created_by:
          type: string
          minLength: 1
        updated_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SourceRevision:
      type: object
      additionalProperties: false
      required: [source_repository_id, ref, commit_sha]
      properties:
        source_repository_id:
          type: string
          minLength: 1
        ref:
          type: string
          minLength: 12
          maxLength: 266
          pattern: '^refs/(heads|tags)/\S+$'
        commit_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: Full resolved Git commit SHA. Short SHAs are never persisted as Build identity.
    BuildConfigurationSnapshot:
      type: object
      additionalProperties: false
      required: [configuration_id, configuration_version, source_repository_id, dockerfile_path, context_path, allowed_refs, registry_credential_id, image_repository, target_platform, resources, timeout_seconds, max_concurrency, auto_create_release, release_runtime_spec, automatic_deployments]
      properties:
        configuration_id:
          type: string
          minLength: 1
        configuration_version:
          type: integer
          format: int64
          minimum: 1
        source_repository_id:
          type: string
          minLength: 1
        dockerfile_path:
          type: string
          minLength: 1
          maxLength: 255
        context_path:
          type: string
          minLength: 1
          maxLength: 255
        allowed_refs:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 12
            maxLength: 266
            pattern: '^refs/(heads|tags)/\S+$'
        registry_credential_id:
          type: string
          minLength: 1
        image_repository:
          type: string
          minLength: 1
          maxLength: 255
        target_platform:
          type: string
          enum: [linux/amd64, linux/arm64]
        resources:
          $ref: "#/components/schemas/BuildResources"
        timeout_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 7200
        max_concurrency:
          type: integer
          minimum: 1
          maximum: 4
        auto_create_release:
          type: boolean
        release_runtime_spec:
          $ref: "#/components/schemas/ReleaseRuntimeSpec"
        automatic_deployments:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/AutomaticDeploymentRule"
    Build:
      type: object
      additionalProperties: false
      required: [id, project_id, application_id, build_configuration_id, revision, configuration_snapshot, trigger_source, idempotency_key, status, version, triggered_by, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        application_id:
          type: string
          minLength: 1
        build_configuration_id:
          type: string
          minLength: 1
        revision:
          $ref: "#/components/schemas/SourceRevision"
        configuration_snapshot:
          $ref: "#/components/schemas/BuildConfigurationSnapshot"
        trigger_source:
          type: string
          enum: [manual, trigger_api, webhook, retry]
        trigger_id:
          type: string
          minLength: 1
          description: Present only for automation-triggered Builds.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        status:
          type: string
          enum: [queued, checking_out, building, pushing, succeeded, failed, canceling, canceled]
        failure_category:
          type: string
          enum: [repository_authentication, repository_unreachable, revision_not_found, checkout_failed, build_configuration, build_resource_limit, build_network_policy, build_failed, registry_authentication, registry_push, canceled, unknown]
        version:
          type: integer
          format: int64
          minimum: 1
        triggered_by:
          type: string
          minLength: 1
        source_build_id:
          type: string
          minLength: 1
          description: Present on retry Builds and points to the immutable failed Build.
        artifact_id:
          type: string
          minLength: 1
          description: Present after the fenced Build result has been published as an Artifact.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    BuildLogPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, truncated, complete]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/BuildLogEntry"
        next_cursor:
          type: string
          minLength: 1
          maxLength: 1024
          description: Opaque Build-bound cursor for the next poll, including when no new entries are currently available.
        truncated:
          type: boolean
          description: True when the per-Build byte cap discarded later log output.
        complete:
          type: boolean
          description: True when the Build is terminal; no new worker log entries are expected.
        expires_at:
          type: string
          format: date-time
          description: Approximate TTL deadline. MongoDB TTL cleanup is asynchronous.
    BuildLogEntry:
      type: object
      additionalProperties: false
      required: [sequence, stage, message, created_at]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        stage:
          type: string
          enum: [system, checkout, build, push, release]
        message:
          type: string
          minLength: 1
          maxLength: 16384
        created_at:
          type: string
          format: date-time
    Artifact:
      type: object
      additionalProperties: false
      required: [id, project_id, application_id, origin, producer, producer_verification, registry_credential_id, image_repository, image_digest, target_platform, release_runtime_spec, automatic_deployments, release_status, version, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        application_id:
          type: string
          minLength: 1
        origin:
          type: string
          enum: [owndock_build, external]
          description: Whether OwnDock built the image or an external CI system registered it.
        producer:
          type: string
          minLength: 1
          maxLength: 200
        producer_verification:
          type: string
          enum: [verified, declared]
          description: "verified identifies OwnDock's own Build Worker boundary; declared means the external producer label is informational until signature or provenance evidence verifies it."
        build_id:
          type: string
          minLength: 1
          description: Present only for an OwnDock-built Artifact.
        build_configuration_id:
          type: string
          minLength: 1
          description: Present only for an OwnDock-built Artifact.
        registry_credential_id:
          type: string
          minLength: 1
        image_repository:
          type: string
          minLength: 1
          maxLength: 255
        image_digest:
          type: string
          pattern: "^.+@sha256:[a-f0-9]{64}$"
        target_platform:
          type: string
          enum: [linux/amd64, linux/arm64]
        release_runtime_spec:
          $ref: "#/components/schemas/ReleaseRuntimeSpec"
        automatic_deployments:
          type: array
          maxItems: 8
          description: Immutable development delivery targets copied from the Build Configuration snapshot.
          items:
            $ref: "#/components/schemas/AutomaticDeploymentRule"
        release_status:
          type: string
          enum: [available, release_pending, release_created]
        release_id:
          type: string
          minLength: 1
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
    ArtifactEvidence:
      type: object
      additionalProperties: false
      description: A bounded index for evidence stored as an OCI artifact. It never embeds a complete SBOM, attestation, signature bundle, vulnerability report, or secret.
      required: [id, organization_id, project_id, artifact_id, subject_digest, kind, media_type, format_version, producer, registry_repository, descriptor_digest, verification_status, created_at]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        organization_id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        artifact_id:
          type: string
          minLength: 1
        subject_digest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        kind:
          type: string
          enum: [sbom, provenance, signature, vulnerability_report]
        media_type:
          type: string
          minLength: 1
          maxLength: 255
        format_version:
          type: string
          minLength: 1
          maxLength: 64
        predicate_type:
          type: string
          format: uri
          maxLength: 512
        producer:
          type: string
          minLength: 1
          maxLength: 200
        registry_repository:
          type: string
          minLength: 1
          maxLength: 255
        descriptor_digest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        verification_status:
          type: string
          enum: [unverified, verified, rejected]
        created_at:
          type: string
          format: date-time
    VulnerabilityCounts:
      type: object
      additionalProperties: false
      required: [unknown, low, medium, high, critical, total, fixable]
      properties:
        unknown: { type: integer, format: int64, minimum: 0 }
        low: { type: integer, format: int64, minimum: 0 }
        medium: { type: integer, format: int64, minimum: 0 }
        high: { type: integer, format: int64, minimum: 0 }
        critical: { type: integer, format: int64, minimum: 0 }
        total: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
        fixable: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
    VulnerabilityObservation:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, artifact_id, subject_digest, evidence_id, descriptor_digest, scanner, scanner_version, database_schema_version, database_updated_at, database_downloaded_at, scanned_at, fresh_until, stale, counts, highest_severity]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        organization_id: { type: string, minLength: 1 }
        project_id: { type: string, minLength: 1 }
        artifact_id: { type: string, minLength: 1 }
        subject_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        evidence_id: { type: string, minLength: 1, maxLength: 128 }
        descriptor_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        scanner: { type: string, enum: [trivy] }
        scanner_version: { type: string, enum: [0.74.0] }
        database_schema_version: { type: integer, format: int64, minimum: 1 }
        database_updated_at: { type: string, format: date-time }
        database_downloaded_at: { type: string, format: date-time }
        scanned_at: { type: string, format: date-time }
        fresh_until: { type: string, format: date-time }
        stale:
          type: boolean
          description: True once the scan-age limit or the scanner database next-update boundary has been reached.
        counts: { $ref: "#/components/schemas/VulnerabilityCounts" }
        highest_severity:
          type: string
          enum: [none, unknown, low, medium, high, critical]
