  schemas:
    DeploymentPolicyRequirements:
      type: object
      additionalProperties: false
      description: Restricted admission fields. At least one requirement must be enabled. Vulnerability severity and scan age must be supplied together; maximum scan age is between 3600 and 2592000 seconds. `unknown` findings always fail a configured vulnerability gate.
      required: [require_sbom, require_provenance, allowed_signature_policy_ids]
      properties:
        require_sbom:
          type: boolean
        require_provenance:
          type: boolean
        allowed_signature_policy_ids:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
          description: A non-empty list means that at least one verified signature must match one of these exact Signature Trust Policy IDs.
        maximum_vulnerability_severity:
          type: string
          enum: [none, low, medium, high, critical]
          description: Highest allowed non-waived finding severity. Must be supplied with maximum_scan_age_seconds.
        maximum_scan_age_seconds:
          type: integer
          format: int64
          minimum: 3600
          maximum: 2592000
          description: Maximum age of the exact vulnerability observation used by admission. Must be supplied with maximum_vulnerability_severity.
    DeploymentPolicyRequest:
      type: object
      additionalProperties: false
      required: [name, scope, mode, requirements, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scope:
          type: string
          enum: [project, environment]
        environment_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Required for Environment scope and forbidden for Project scope. Scope cannot change during update.
        mode:
          type: string
          enum: [advisory, enforced]
          description: Development Environment policies must be advisory and production Environment policies must be enforced. Staging and Project policies may select either; the evaluator still applies the target Environment safety floor.
        requirements: { $ref: "#/components/schemas/DeploymentPolicyRequirements" }
        enabled: { type: boolean }
        expected_version:
          type: integer
          format: int64
          minimum: 1
          description: Required only for update and rejected during create.
    DeploymentPolicy:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, name, scope, mode, requirements, enabled, version, created_by, updated_by, created_at, updated_at]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        organization_id: { type: string, minLength: 1, maxLength: 128 }
        project_id: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 100 }
        scope: { type: string, enum: [project, environment] }
        environment_id: { type: string, minLength: 1, maxLength: 128 }
        mode: { type: string, enum: [advisory, enforced] }
        requirements: { $ref: "#/components/schemas/DeploymentPolicyRequirements" }
        enabled: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
        created_by: { type: string, minLength: 1, maxLength: 128 }
        updated_by: { type: string, minLength: 1, maxLength: 128 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VulnerabilityWaiverRequest:
      type: object
      additionalProperties: false
      required: [scope, vulnerability_id, reason, expires_at]
      properties:
        scope:
          type: string
          enum: [project, artifact]
        artifact_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Required only for Artifact scope. The server resolves and stores the immutable subject digest.
        vulnerability_id:
          type: string
          minLength: 2
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:+-]{1,127}$'
          description: One exact scanner finding identifier such as CVE-2026-12345. Input is case-insensitive and stored in uppercase; wildcards are rejected.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        expires_at:
          type: string
          format: date-time
          description: Must be between one hour and 180 days after server approval time.
    VulnerabilityWaiverRevokeRequest:
      type: object
      additionalProperties: false
      required: [reason, expected_version]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        expected_version: { type: integer, format: int64, enum: [1] }
    VulnerabilityWaiver:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, scope, vulnerability_id, reason, approved_by, expires_at, status, version, created_at]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        organization_id: { type: string, minLength: 1, maxLength: 128 }
        project_id: { type: string, minLength: 1, maxLength: 128 }
        scope: { type: string, enum: [project, artifact] }
        artifact_id: { type: string, minLength: 1, maxLength: 128 }
        subject_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Present only for Artifact scope and fixed from the immutable Artifact at approval time.
        vulnerability_id:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9._:+-]{1,127}$'
        reason: { type: string, minLength: 1, maxLength: 1000 }
        approved_by: { type: string, minLength: 1, maxLength: 128 }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [active, expired, revoked] }
        version: { type: integer, format: int64, enum: [1, 2] }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        revoked_by: { type: string, minLength: 1, maxLength: 128 }
        revocation_reason: { type: string, minLength: 1, maxLength: 1000 }
    SignatureTrustPolicyRequest:
      type: object
      additionalProperties: false
      required: [name, mode, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        mode:
          type: string
          enum: [public_key, keyless]
        public_key_pem:
          type: string
          minLength: 64
          maxLength: 65536
          description: PEM-encoded verification public key. Mutually exclusive with all keyless fields. Private keys are rejected.
        trusted_root_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Reference to an externally supplied offline Sigstore trusted-root document.
        trusted_root_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Pinned digest of the referenced trusted root; rotation requires a new policy version.
        certificate_identity:
          type: string
          minLength: 1
          maxLength: 1024
          description: Exact certificate identity; regular expressions and wildcards are not accepted.
        oidc_issuer:
          type: string
          format: uri
          maxLength: 2048
          description: Exact HTTPS OIDC issuer.
        enabled:
          type: boolean
        expected_version:
          type: integer
          format: int64
          minimum: 1
    SignatureTrustPolicy:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, name, mode, enabled, version, created_at, updated_at]
      properties:
        id:
          type: string
          minLength: 1
        organization_id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        mode:
          type: string
