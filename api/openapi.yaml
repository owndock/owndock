        tls_server_name:
          type: string
          minLength: 1
        credential_configured:
          type: boolean
          readOnly: true
        status:
          type: string
          enum: [pending, ready, unreachable, credential_error, retiring]
        last_probed_at:
          type: string
          format: date-time
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, organization_id, actor_id, action, resource_type, resource_id, created_at]
      properties:
        id:
          type: string
          minLength: 1
        organization_id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        actor_id:
          type: string
          minLength: 1
        action:
          type: string
          minLength: 1
        resource_type:
          type: string
          minLength: 1
        resource_id:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        details:
          type: object
          description: Optional operation-specific safe details. Deployment admission denials include evaluated policy versions, effective modes, stable violation codes, and the evaluation digest; raw infrastructure errors and secrets are never included.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    CreateNamedResourceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
    CreateProductApplicationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        template_id:
          type: string
          minLength: 1
          maxLength: 80
          description: Optional immutable built-in Template to copy into the new Application snapshot.
    CreateReleaseRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
          pattern: "^.+@sha256:[a-f0-9]{64}$"
        registry_credential_id:
          type: string
          minLength: 1
        runtime_spec:
          $ref: "#/components/schemas/ReleaseRuntimeSpec"
    CreateArtifactReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        runtime_spec:
          allOf:
            - $ref: "#/components/schemas/ReleaseRuntimeSpec"
          description: Optional override. When omitted, the immutable runtime specification saved on the Artifact is used.
    RegisterExternalArtifactRequest:
      type: object
      additionalProperties: false
      required: [application_id, registry_credential_id, image_digest, target_platform, producer]
      properties:
        application_id:
          type: string
          minLength: 1
          maxLength: 128
        registry_credential_id:
          type: string
          minLength: 1
          maxLength: 128
        image_digest:
          type: string
          pattern: "^.+@sha256:[a-f0-9]{64}$"
          description: Complete immutable image reference, for example registry.example.com/team/api@sha256:...; tags such as latest are rejected.
        target_platform:
          type: string
          enum: [linux/amd64, linux/arm64]
        producer:
          type: string
          minLength: 1
          maxLength: 200
          description: Human-readable identity declared by the external CI integration, for example github-actions/acme/api. This value is not treated as cryptographic proof.
        release_runtime_spec:
          $ref: "#/components/schemas/ReleaseRuntimeSpec"
    CreateRegistryCredentialRequest:
      type: object
      additionalProperties: false
      required: [name, server, authentication_mode]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        server:
          type: string
          minLength: 1
        authentication_mode:
          type: string
          enum: [anonymous, basic]
          description: Use anonymous for public registries. Basic requires both username and password_ref. Anonymous rejects both fields.
        username:
          type: string
          minLength: 1
          maxLength: 255
          description: Required only when authentication_mode is basic.
        password_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
          writeOnly: true
          description: Required only when authentication_mode is basic. The referenced password is resolved per operation and never stored in API payloads or job snapshots.
    CreateRepositoryCredentialRequest:
      type: object
      additionalProperties: false
      required: [name, type, secret_ref]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [ssh_deploy_key, https_access_token]
        username:
          type: string
          maxLength: 128
        secret_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
          writeOnly: true
        public_key_fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
    CreateSourceRepositoryRequest:
      type: object
      additionalProperties: false
      required: [name, repository_url, default_branch]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        repository_url:
          type: string
          minLength: 1
          maxLength: 2048
        default_branch:
          type: string
          minLength: 1
          maxLength: 255
        credential_id:
          type: string
          minLength: 1
        ssh_host_key_fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
    CreateBuildConfigurationRequest:
      type: object
      additionalProperties: false
      required: [name, source_repository_id, registry_credential_id, image_repository]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        source_repository_id:
          type: string
          minLength: 1
        dockerfile_path:
          type: string
          minLength: 1
          maxLength: 255
          default: Dockerfile
        context_path:
          type: string
          minLength: 1
          maxLength: 255
          default: "."
        allowed_refs:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: Defaults to the Source Repository default branch when omitted.
          items:
            type: string
            minLength: 12
            maxLength: 266
            pattern: '^refs/(heads|tags)/\S+$'
        registry_credential_id:
          type: string
          minLength: 1
        image_repository:
          type: string
          minLength: 1
          maxLength: 255
        target_platform:
          type: string
          enum: [linux/amd64, linux/arm64]
          default: linux/amd64
        resources:
          $ref: "#/components/schemas/BuildResources"
        timeout_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 7200
          default: 1800
        max_concurrency:
          type: integer
          minimum: 1
          maximum: 4
          default: 1
        auto_create_release:
          type: boolean
          default: true
        release_runtime_spec:
          $ref: "#/components/schemas/ReleaseRuntimeSpec"
        automatic_deployments:
          type: array
          maxItems: 8
          description: Explicit automatic deployment targets. Only development Environments are accepted, auto_create_release must remain true, and changing the list requires Maintainer permission.
          items:
            $ref: "#/components/schemas/AutomaticDeploymentRule"
    PatchBuildConfigurationRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        source_repository_id:
          type: string
          minLength: 1
        dockerfile_path:
          type: string
          minLength: 1
          maxLength: 255
        context_path:
          type: string
          minLength: 1
          maxLength: 255
        allowed_refs:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 12
            maxLength: 266
            pattern: '^refs/(heads|tags)/\S+$'
        registry_credential_id:
          type: string
          minLength: 1
        image_repository:
          type: string
          minLength: 1
          maxLength: 255
        target_platform:
          type: string
          enum: [linux/amd64, linux/arm64]
        resources:
          $ref: "#/components/schemas/BuildResources"
        timeout_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 7200
        max_concurrency:
          type: integer
          minimum: 1
          maximum: 4
        auto_create_release:
          type: boolean
        release_runtime_spec:
          $ref: "#/components/schemas/ReleaseRuntimeSpec"
        automatic_deployments:
          type: array
          maxItems: 8
          description: Replaces the complete automatic deployment target list. An empty array disables automatic deployment.
          items:
            $ref: "#/components/schemas/AutomaticDeploymentRule"
    TriggerManualBuildRequest:
      type: object
      additionalProperties: false
      required: [application_id, build_configuration_id, ref, idempotency_key]
      properties:
        application_id:
          type: string
          minLength: 1
          maxLength: 128
        build_configuration_id:
          type: string
          minLength: 1
          maxLength: 128
        ref:
          type: string
          minLength: 12
          maxLength: 266
          pattern: '^refs/(heads|tags)/\S+$'
          description: Exact ref that must appear in the Build Configuration allowed_refs list.
        expected_commit_sha:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
          description: Optional full commit expected at ref. A mismatch returns 409 instead of silently building another revision.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
    RetryBuildRequest:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
    CreateBuildTriggerRequest:
      type: object
      additionalProperties: false
      required: [name, allowed_refs]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        allowed_refs:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: '^refs/(heads|tags)/\S+$'
    CreateBuildHookRequest:
      type: object
      additionalProperties: false
      required: [name, provider, allowed_refs, secret_ref]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        provider:
          type: string
          enum: [github, gitlab, gitea, forgejo]
        allowed_refs:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: '^refs/(heads|tags)/\S+$'
        secret_ref:
          type: string
          pattern: '^secret://[a-z0-9][a-z0-9-]{0,62}$'
    TriggerExternalBuildRequest:
      type: object
      additionalProperties: false
      required: [commit_sha, ref]
      properties:
        commit_sha:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
        ref:
          type: string
          minLength: 12
          maxLength: 266
          pattern: '^refs/(heads|tags)/\S+$'
    CreateManagedHostRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateAgentManagedHostRequest"
        - $ref: "#/components/schemas/CreateDirectManagedHostRequest"
    CreateAgentManagedHostRequest:
      type: object
      additionalProperties: false
      required: [name, connection_mode]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        connection_mode:
          type: string
          enum: [agent]
    CreateDirectManagedHostRequest:
      type: object
      additionalProperties: false
      required: [name, connection_mode]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        connection_mode:
          type: string
          enum: [direct]
        direct_ssh_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
          description: Optional direct SSH private-key reference. If set, address, user and host-key fingerprint are all required.
        direct_ssh_address:
          type: string
          minLength: 3
          maxLength: 255
          description: Fixed SSH host and port, for example host.example.com:22.
        direct_ssh_user:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,31}$"
        direct_ssh_host_key_sha256:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
    CreateRuntimeTargetRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateAgentRuntimeTargetRequest"
        - $ref: "#/components/schemas/CreateDirectRuntimeTargetRequest"
    CreateAgentRuntimeTargetRequest:
      type: object
      additionalProperties: false
      required: [name, managed_host_id, connection_mode]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        managed_host_id:
          type: string
          minLength: 1
        connection_mode:
          type: string
          enum: [agent]
    CreateDirectRuntimeTargetRequest:
      type: object
      additionalProperties: false
      required: [name, managed_host_id, connection_mode, endpoint, tls_server_name, credential_ref]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        managed_host_id:
          type: string
          minLength: 1
        connection_mode:
          type: string
          enum: [direct]
        endpoint:
          type: string
          pattern: "^tcp://.+:[0-9]+$"
        tls_server_name:
          type: string
          minLength: 1
        credential_ref:
          type: string
          pattern: "^secret://[a-z0-9][a-z0-9-]{0,62}$"
    Application:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum: [pending, ready, failed]
        created_at:
          type: string
          format: date-time
    Environment:
      type: object
      additionalProperties: false
      required: [id, name, provider, status, created_at]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        provider:
          type: string
          minLength: 1
        status:
          type: string
          enum: [active, draining, deleted]
        created_at:
          type: string
          format: date-time
    ProjectEnvironment:
      type: object
      additionalProperties: false
      required: [id, project_id, name, stage, variable_keys, created_by, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        stage:
          type: string
          enum: [development, staging, production]
        variable_keys:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
          readOnly: true
        created_by:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    DeploymentAdmissionPolicySnapshot:
      type: object
      additionalProperties: false
      required: [id, version, scope, mode, requirements]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        version: { type: integer, format: int64, minimum: 1 }
        scope: { type: string, enum: [project, environment] }
        environment_id: { type: string, minLength: 1, maxLength: 128 }
        mode:
          type: string
          enum: [advisory, enforced]
          description: Effective mode after applying the target Environment safety floor, not merely the stored configuration.
        requirements: { $ref: "#/components/schemas/DeploymentPolicyRequirements" }
    DeploymentAdmissionEvidenceSnapshot:
      type: object
      additionalProperties: false
      required: [id, kind, descriptor_digest, content_digest]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [sbom, provenance, vulnerability_report] }
        descriptor_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        content_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    DeploymentAdmissionVerificationSnapshot:
      type: object
      additionalProperties: false
      required: [id, trust_policy_id, trust_policy_version, bundle_set_digest]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        trust_policy_id: { type: string, minLength: 1, maxLength: 128 }
        trust_policy_version: { type: integer, format: int64, minimum: 1 }
        bundle_set_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    DeploymentAdmissionVulnerabilityCounts:
      type: object
      additionalProperties: false
      required: [unknown, low, medium, high, critical, total]
      properties:
        unknown: { type: integer, format: int64, minimum: 0 }
        low: { type: integer, format: int64, minimum: 0 }
        medium: { type: integer, format: int64, minimum: 0 }
        high: { type: integer, format: int64, minimum: 0 }
        critical: { type: integer, format: int64, minimum: 0 }
        total: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
    DeploymentAdmissionVulnerabilitySnapshot:
      type: object
      additionalProperties: false
      required: [observation_id, evidence_id, descriptor_digest, content_digest, scanner, scanner_version, database_version, database_updated_at, scanned_at, fresh_until, original_counts, remaining_counts, highest_remaining]
      properties:
        observation_id: { type: string, minLength: 1, maxLength: 128 }
        evidence_id: { type: string, minLength: 1, maxLength: 128 }
        descriptor_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        content_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        scanner: { type: string, enum: [trivy] }
        scanner_version: { type: string, enum: [0.74.0] }
        database_version: { type: integer, format: int64, minimum: 1 }
        database_updated_at: { type: string, format: date-time }
        scanned_at: { type: string, format: date-time }
        fresh_until: { type: string, format: date-time }
        original_counts: { $ref: "#/components/schemas/DeploymentAdmissionVulnerabilityCounts" }
        remaining_counts: { $ref: "#/components/schemas/DeploymentAdmissionVulnerabilityCounts" }
        highest_remaining: { type: string, enum: [none, unknown, low, medium, high, critical] }
    DeploymentAdmissionWaiverSnapshot:
      type: object
      additionalProperties: false
      required: [id, version, scope, vulnerability_id, expires_at]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        version: { type: integer, format: int64, minimum: 1 }
        scope: { type: string, enum: [project, artifact] }
        vulnerability_id: { type: string, minLength: 1, maxLength: 256 }
        expires_at: { type: string, format: date-time }
    DeploymentAdmissionViolation:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        policy_id: { type: string, minLength: 1, maxLength: 128 }
        code:
          type: string
          enum: [policy_unavailable, artifact_unavailable, sbom_missing, provenance_missing, evidence_unavailable, signature_missing, vulnerability_observation_missing, vulnerability_observation_stale, vulnerability_report_integrity, vulnerability_severity_unknown, vulnerability_severity_exceeded]
    DeploymentAdmissionSnapshot:
      type: object
      additionalProperties: false
      description: Immutable result used when this Deployment was created. The two digests make policy/evidence drift detectable; later policy updates, rescans, or waiver expiry do not rewrite this history.
      required: [evaluated_at, environment_stage, policies, evidence, verifications, waivers, violations, decision, evidence_set_digest, evaluation_digest]
      properties:
        evaluated_at: { type: string, format: date-time }
        environment_stage: { type: string, enum: [development, staging, production] }
        artifact_id: { type: string, minLength: 1, maxLength: 128 }
        subject_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        policies:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/DeploymentAdmissionPolicySnapshot" }
        evidence:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/DeploymentAdmissionEvidenceSnapshot" }
        verifications:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/DeploymentAdmissionVerificationSnapshot" }
        vulnerability: { $ref: "#/components/schemas/DeploymentAdmissionVulnerabilitySnapshot" }
        waivers:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/DeploymentAdmissionWaiverSnapshot" }
        violations:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/DeploymentAdmissionViolation" }
        decision: { type: string, enum: [not_configured, admitted, admitted_with_warnings, denied] }
        evidence_set_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        evaluation_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    ProjectDeployment:
      type: object
      additionalProperties: false
      required: [id, project_id, release_id, application_id, environment_id, runtime_target_id, operation, trigger_source, status, created_at]
      properties:
        id:
          type: string
          minLength: 1
        project_id:
          type: string
          minLength: 1
        release_id:
          type: string
          minLength: 1
        application_id:
          type: string
          minLength: 1
        environment_id:
          type: string
          minLength: 1
        runtime_target_id:
          type: string
          minLength: 1
        operation:
          type: string
          enum: [deploy, retry, rollback]
        trigger_source:
          type: string
          enum: [manual, automatic]
        source_artifact_id:
          type: string
          minLength: 1
          description: Present for an automatic Deployment created from an Artifact.
        source_build_id:
          type: string
          minLength: 1
          description: Present for an automatic Deployment created from a Build.
        build_configuration_id:
          type: string
          minLength: 1
          description: Build Configuration snapshot source for an automatic Deployment.
        source_deployment_id:
          type: string
          minLength: 1
        revision:
          type: string
        status:
          type: string
          enum: [queued, preparing, deploying, canceling, succeeded, failed, canceled]
        failure_category:
          type: string
          description: Safe failure category present only when status is failed.
          enum: [configuration, credential, target_unreachable, image_pull, runtime, unsupported_target, unknown]
        admission:
          $ref: "#/components/schemas/DeploymentAdmissionSnapshot"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Deployment:
      type: object
      additionalProperties: false
      required: [id, application_id, environment_id, revision, status, created_at]
      properties:
        id:
          type: string
          minLength: 1
        application_id:
          type: string
          minLength: 1
        environment_id:
          type: string
          minLength: 1
        revision:
          type: string
        status:
          type: string
          enum: [queued, preparing, deploying, succeeded, failed, canceled]
        created_at:
          type: string
          format: date-time
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
    CreateEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [name, provider]
      properties:
        name:
          type: string
        provider:
          type: string
    CreateProjectEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [name, stage]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        stage:
          type: string
          enum: [development, staging, production]
        variables:
          type: object
          maxProperties: 100
          additionalProperties:
            type: string
            maxLength: 4096
    CreateProjectDeploymentRequest:
      type: object
      additionalProperties: false
      required: [release_id, application_id, environment_id, runtime_target_id]
      properties:
        release_id:
          type: string
          minLength: 1
        application_id:
          type: string
          minLength: 1
        environment_id:
          type: string
          minLength: 1
        runtime_target_id:
          type: string
          minLength: 1
    CreateRollbackDeploymentRequest:
      type: object
      additionalProperties: false
      required: [release_id]
      properties:
        release_id:
          type: string
          minLength: 1
    CreateDeploymentRequest:
      type: object
      additionalProperties: false
      required: [application_id, environment_id]
      properties:
        application_id:
          type: string
        environment_id:
          type: string
        revision:
          type: string
    RuntimeInventoryState:
      type: object
      additionalProperties: false
      required: [observation_id, organization_id, managed_host_id, runtime_target_id, kind, runtime_id, name, managed, ports, mounts, networks, observed_at, schema_version, presence, first_seen_at, last_seen_at, reconciled_at, generation]
      properties:
        observation_id:
          type: string
          minLength: 1
        organization_id:
