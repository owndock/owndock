openapi: 3.0.3
info:
  title: OwnDock API
  version: 0.1.0
  description: Pre-release browser, management, and automation HTTP contract. Identity, the read-only built-in Template catalog, Managed Host and Agent enrollment, Project-scoped Application, Release, Registry Credential, Source Repository connection, Build Configuration, manual, token, and signed Webhook Build trigger/query, bounded incremental Build logs, Artifact, digest-bound Artifact Evidence, vulnerability waivers, versioned restricted Deployment Policies and immutable admission snapshots, Release handoff, Environment, Runtime Target, Deployment lifecycle, Runtime Inventory, controlled Terminal Session, and Audit operations form the implemented product slice when product mode is enabled. Every formal Product API operation is subject to shared source and installation-wide ingress admission and can return 429 rate_limited or fail-closed 503 ingress_protection_unavailable with Retry-After. Browser access is same-origin by default; configured cross-origin clients use exact origins without REST authentication cookies, and every `/api/` response is non-cacheable. Terminal connection tickets are short-lived, one-time, path-scoped Secure HttpOnly cookies and are never returned in a URL or JSON body. The separate mTLS Agent Control v1 transport is documented outside this OpenAPI; its typed commands and Agent Runtime Gateway are internal transports. Top-level Application, Environment, and Deployment operations remain disabled engineering samples.
  x-owndock-stability: pre-release
servers:
  - url: /
tags:
  - name: Health
  - name: Meta
  - name: Identity
  - name: Projects
  - name: Product Applications
  - name: Templates
  - name: Releases
  - name: Managed Hosts
  - name: Runtime Targets
  - name: Runtime Inventory
  - name: Terminal Sessions
  - name: Registry Credentials
  - name: Source Repositories
  - name: Build Configurations
  - name: Build Triggers
  - name: Build Hooks
  - name: Builds
  - name: Artifacts
  - name: Artifact Evidence
  - name: Deployment Policies
  - name: Vulnerability Waivers
  - name: Audit
  - name: Applications
  - name: Environments
  - name: Deployments
paths:
  /livez:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the process is alive
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
  /readyz:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether the process is ready to serve traffic
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/meta/version:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Meta]
      operationId: getVersion
      summary: Get service prepare information
      responses:
        "200":
          $ref: "#/components/responses/Version"
  /api/v1/managed-hosts:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Managed Hosts]
      operationId: listManagedHosts
      summary: List Organization-owned managed hosts
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ManagedHostList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    post:
      tags: [Managed Hosts]
      operationId: createManagedHost
      summary: Register an Organization-owned managed host
      description: Only an Owner may register a host. Agent hosts remain enrolling until the separate enrollment flow creates a fixed Agent identity, then remain offline until the authenticated Agent Control flow establishes liveness.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManagedHostRequest"
      responses:
        "201":
          $ref: "#/components/responses/ManagedHostCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/managed-hosts/{managed_host_id}:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ManagedHostID"
    get:
      tags: [Managed Hosts]
      operationId: getManagedHost
      summary: Get an Organization-owned managed host
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ManagedHostResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/managed-hosts/{managed_host_id}/runtime-inventory:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ManagedHostID"
    get:
      tags: [Runtime Inventory]
      operationId: listHostRuntimeInventory
      summary: List safe runtime inventory for a managed host
      description: Owner and Maintainer only. Returns containers, images, networks, and volumes observed on this Organization-owned host. This permission does not grant terminal access. Callers cannot provide a Docker endpoint, object ID selector, or arbitrary Docker filter.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InventoryRuntimeTargetID"
        - $ref: "#/components/parameters/InventoryKind"
        - $ref: "#/components/parameters/InventoryIncludeAbsent"
        - $ref: "#/components/parameters/InventoryLimit"
        - $ref: "#/components/parameters/InventoryCursor"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeInventoryStatePage"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/managed-hosts/{managed_host_id}:disable:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ManagedHostID"
    post:
      tags: [Managed Hosts]
      operationId: disableManagedHost
      summary: Disable a managed host and revoke its active Agent identity
      description: Only an Owner may disable a Host. Any unused enrollment credentials are expired in the same transaction.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ManagedHostResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/managed-hosts/{managed_host_id}/enrollments:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ManagedHostID"
    post:
      tags: [Managed Hosts]
      operationId: createAgentEnrollment
      summary: Create a one-time Agent enrollment credential
      description: Only an Owner may create an enrollment. The raw token is returned once and only its SHA-256 hash is persisted. Creating a new credential expires any previous unused credential for the Host.
      security:
        - bearerAuth: []
      responses:
        "201":
          $ref: "#/components/responses/AgentEnrollmentCreated"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/terminal-policy:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Terminal Sessions]
      operationId: getOrganizationTerminalPolicy
      summary: Get the Organization host-terminal policy
      description: Owner only. When no policy has been saved, returns the restrictive default that allows host terminals only for Owners.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/TerminalPolicyResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    put:
      tags: [Terminal Sessions]
      operationId: updateOrganizationTerminalPolicy
      summary: Create or replace the Organization host-terminal policy
      description: Owner only. expected_version is 0 when saving the returned default for the first time, then must match the persisted version.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalPolicyRequest"
      responses:
        "200":
          $ref: "#/components/responses/TerminalPolicyResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/terminal-policy:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Terminal Sessions]
      operationId: getProjectTerminalPolicy
      summary: Get the Project container-terminal policy
      description: The default allows Owner and Maintainer access in development and staging; production and Developer access require an explicit policy.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/TerminalPolicyResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
    put:
      tags: [Terminal Sessions]
      operationId: updateProjectTerminalPolicy
      summary: Create or replace the Project container-terminal policy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalPolicyRequest"
      responses:
        "200":
          $ref: "#/components/responses/TerminalPolicyResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/terminal-sessions/container:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    post:
      tags: [Terminal Sessions]
      operationId: createContainerTerminalSession
      summary: Request a terminal for the current managed container of a Deployment
      description: Accepts only a Deployment ID. OwnDock resolves the current successful cutover, Runtime Target, Managed Host, and running instance. Callers cannot supply a container ID, Docker endpoint, shell, command, or username. The one-time connection ticket is set only as a path-scoped Secure HttpOnly cookie.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContainerTerminalSessionRequest"
      responses:
        "201":
          $ref: "#/components/responses/TerminalCredentialResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/managed-hosts/{managed_host_id}/terminal-sessions:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ManagedHostID"
    post:
      tags: [Terminal Sessions]
      operationId: createHostTerminalSession
      summary: Request a terminal for a registered Managed Host
      description: The Managed Host ID fixes the target. Callers cannot supply an SSH address, Docker endpoint, shell, command, or username. Host-terminal access defaults to Owner only.
      security:
        - bearerAuth: []
      responses:
        "201":
          $ref: "#/components/responses/TerminalCredentialResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/terminal-sessions/{terminal_session_id}:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/TerminalSessionID"
    get:
      tags: [Terminal Sessions]
      operationId: getTerminalSession
      summary: Get safe Terminal Session metadata
      description: Returns lifecycle and fixed target references, never the one-time ticket, its hash, terminal input, or terminal output.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/TerminalSessionResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/terminal-sessions/{terminal_session_id}:terminate:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/TerminalSessionID"
    post:
      tags: [Terminal Sessions]
      operationId: terminateTerminalSession
      summary: Request idempotent Terminal Session termination
      description: A user may terminate their own session. An Owner may terminate any Organization session and a Project Maintainer may terminate another user's Project container session.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/TerminalSessionResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/terminal-sessions/{terminal_session_id}:connect:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/TerminalSessionID"
    get:
      tags: [Terminal Sessions]
      operationId: connectTerminalSession
      summary: Upgrade a pending container or host Terminal Session to WSS
      description: Requires the owndock.terminal.v1 WebSocket subprotocol, a strictly same-origin browser request, and the short-lived path-scoped HttpOnly ticket cookie. The Bearer token is not placed in the URL or WebSocket subprotocol. The Server revalidates the login session bound at creation, atomically consumes the ticket, selects the persisted session kind and fixed target, and then expects an OPEN v1 control message with only the initial terminal size.
      security:
        - terminalTicket: []
      responses:
        "101":
          description: WebSocket protocol switched. Subsequent text messages carry bounded terminal control metadata and binary messages carry bounded stdin/stdout bytes.
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "405":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
  /api/v1/agent/enrollments:exchange:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Managed Hosts]
      operationId: exchangeAgentEnrollment
      summary: Exchange a one-time enrollment token and CSR for an Agent certificate
      description: This bootstrap endpoint does not accept a user session. The enrollment token is carried only in the JSON body and is consumed atomically. For response-loss recovery, the exact same token, CSR, instance, version, protocol and capability request may retrieve the original identity and certificate for 10 minutes; any changed request is rejected and no second identity or audit event is created.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeAgentEnrollmentRequest"
      responses:
        "201":
          $ref: "#/components/responses/AgentCredentialsCreated"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/bootstrap:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Identity]
      operationId: bootstrapIdentity
      summary: Initialize the first organization and owner
      parameters:
        - name: X-OwnDock-Bootstrap-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          $ref: "#/components/responses/Credentials"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/login:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Identity]
      operationId: login
      summary: Create a local bearer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/Credentials"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "429":
          description: Login attempt limit exceeded.
          headers:
            Retry-After:
              description: Seconds before another login attempt is allowed.
              schema:
                type: integer
                minimum: 1
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/me:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Identity]
      operationId: getCurrentIdentity
      summary: Get the current authenticated identity
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/CurrentIdentity"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/logout:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      tags: [Identity]
      operationId: logout
      summary: Revoke the current bearer session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "401":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/sessions:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Identity]
      operationId: listCurrentUserSessions
      summary: List active sessions owned by the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/SessionList"
        "401":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    delete:
      tags: [Identity]
      operationId: revokeCurrentUserSession
      summary: Revoke one active session owned by the current user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "401":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/users:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      tags: [Identity]
      operationId: listOrganizationUsers
      summary: List safe user metadata in the current Organization
      description: Owner only. Password hashes and session or invitation tokens are never returned.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/OrganizationUserList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/users/{user_id}/sessions:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      tags: [Identity]
      operationId: listUserSessionsAsOwner
      summary: List one Organization user's active sessions
      description: Owner only. The response is no-store and never contains bearer tokens or token hashes.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/SessionList"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/IngressRateLimited"
        "500":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/IngressProtectionUnavailable"
    delete:
      tags: [Identity]
      operationId: revokeAllUserSessionsAsOwner
      summary: Revoke all sessions for one Organization user
      description: Owner only. This is an idempotent emergency action and cannot target the current Owner. The user must log in again on every device.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/AdminSessionRevocation"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/IngressRateLimited"
        "500":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/IngressProtectionUnavailable"
  /api/v1/auth/users/{user_id}/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    delete:
      tags: [Identity]
      operationId: revokeUserSessionAsOwner
      summary: Revoke one Organization user's active session
      description: Owner only. The current Owner session cannot be revoked through this administrative route.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
