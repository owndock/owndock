        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
  /api/v1/projects/{project_id}/runtime-inventory:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Runtime Inventory]
      operationId: listProjectRuntimeInventory
      summary: List verified managed runtime inventory for a project
      description: Returns only containers whose OwnDock labels match a successful Deployment in this Organization, Project, and Runtime Target. Related image, mount, port, and network summaries are embedded in each container; host-wide image, network, and volume objects are not exposed. Callers cannot provide a Docker endpoint, container ID, or arbitrary Docker filter.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InventoryRuntimeTargetID"
        - name: kind
          in: query
          required: false
          description: The Project view currently contains verified managed containers only.
          schema:
            type: string
            enum: [container]
        - $ref: "#/components/parameters/InventoryIncludeAbsent"
        - $ref: "#/components/parameters/InventoryLimit"
        - $ref: "#/components/parameters/InventoryCursor"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeInventoryStatePage"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "500":
