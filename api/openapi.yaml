      description: Returns only containers whose OwnDock labels match a successful Deployment in this Organization, Project, and Runtime Target. Related image, mount, port, and network summaries are embedded in each container; host-wide image, network, and volume objects are not exposed. Callers cannot provide a Docker endpoint, container ID, or arbitrary Docker filter.
      security:
