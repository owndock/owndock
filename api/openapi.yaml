components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller-provided request correlation identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]+$"
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SourceRepositoryID:
      name: source_repository_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ApplicationID:
      name: application_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DeploymentID:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RuntimeTargetID:
      name: runtime_target_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ManagedHostID:
      name: managed_host_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    InventoryRuntimeTargetID:
      name: runtime_target_id
      in: query
      required: false
      description: Restrict results to one registered runtime target.
      schema:
        type: string
        minLength: 1
        maxLength: 160
    InventoryKind:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum: [container, image, network, volume]
    InventoryIncludeAbsent:
      name: include_absent
      in: query
      required: false
      description: Include resources recently confirmed absent. They are retained for a bounded explanation window.
      schema:
        type: boolean
        default: false
    InventoryLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    InventoryCursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor returned by the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  headers:
    RequestID:
      description: Request correlation identifier accepted from or generated by OwnDock.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]+$"
  responses:
    HealthOK:
      description: Process is healthy.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    NotReady:
      description: Process is not ready to serve traffic.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    Version:
      description: Service prepare information.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Version"
    Credentials:
      description: Bearer credentials issued.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Credentials"
    CurrentIdentity:
      description: Current authenticated identity.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IdentityUser"
    SessionList:
      description: Active sessions owned by the current user.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
    ProjectList:
      description: Project collection.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    ProjectCreated:
      description: Project created.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Project"
    ProductApplicationList:
      description: Project application collection.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
