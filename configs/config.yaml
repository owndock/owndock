server:
  http:
    address: 0.0.0.0:8000
    timeout: 30s
    shutdown_timeout: 15s

observability:
  tracing:
    enabled: false
    endpoint: localhost:4318
    insecure: true
    sample_ratio: 1

development:
  enable_engineering_samples: false

database:
  mongo:
    enabled: false
    uri_env: OWNDOCK_MONGODB_URI
    database: owndock
    connect_timeout: 10s
    operation_timeout: 5s
    max_idle_time: 5m
    min_pool_size: 0
    max_pool_size: 100
