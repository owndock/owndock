server:
  http:
    address: 0.0.0.0:8000
    timeout: 30s
    shutdown_timeout: 15s
    # Exact origins for the separate browser frontend. Empty means same-origin
    # only. Use HTTPS outside loopback development; wildcards are rejected.
    cors_allowed_origins: []
  agent:
    enabled: false
    address: 0.0.0.0:8443
    server_certificate_env: OWNDOCK_AGENT_SERVER_CERT_PEM
    server_private_key_env: OWNDOCK_AGENT_SERVER_KEY_PEM
    handshake_timeout: 10s
    heartbeat_interval: 10s
    heartbeat_timeout: 30s
    max_frame_bytes: 65536
    outbound_buffer: 32
    completed_command_cache: 256
    protocol_versions: [v1]

observability:
  tracing:
    enabled: false
    endpoint: localhost:4318
    insecure: true
    sample_ratio: 1

development:
  enable_engineering_samples: false

product:
  enabled: false
  source_probe_timeout: 10s
  build_trigger_rate_limit: 60
  build_trigger_rate_window: 1m
  build_webhook_rate_limit: 120
  build_webhook_rate_window: 1m
  build_webhook_max_body_bytes: 1048576

runtime:
  build_worker:
    enabled: false
    poll_interval: 2s
    lease_duration: 30s
    operation_timeout: 2h15m
    checkout_timeout: 10m
    workspace_root: /var/lib/owndock/builds
    max_workspace_bytes: 5368709120
    max_workspace_files: 250000
    git_executable: git
    git_version: 2.55.0
    buildkit_endpoint: unix:///run/owndock-buildkit/buildkitd.sock
    buildkit_server_name: ""
    buildkit_ca_cert_file: ""
    buildkit_client_cert_file: ""
    buildkit_client_key_file: ""
    log_retention: 168h
    log_max_bytes: 10485760
    log_chunk_bytes: 16384
    metrics_address: 127.0.0.1:9091
  deployment_worker:
    enabled: false
    poll_interval: 2s
    lease_duration: 30s
    operation_timeout: 10m
  inventory_worker:
    enabled: false
    poll_interval: 2s
    sync_interval: 5m
    retry_interval: 30s
    event_poll_interval: 1s
    event_wait: 2s
    lease_duration: 2m
    operation_timeout: 1m
    command_timeout: 20s
    concurrency: 2
    event_concurrency: 4
    candidate_limit: 256
    max_chunk_bytes: 49152

security:
  bootstrap_token_env: OWNDOCK_BOOTSTRAP_TOKEN
  session_ttl: 24h
  max_active_sessions: 10
  user_invitation_ttl: 24h
  login_attempt_limit: 5
  login_attempt_window: 15m
  ingress_source_limit: 600
  ingress_global_limit: 6000
  ingress_rate_window: 1m
  # X-Forwarded-For is trusted only when the direct peer matches one of these
  # canonical CIDRs. Keep empty for direct deployments.
  trusted_proxy_cidrs: []
  agent_pki:
    enabled: false
    ca_certificate_env: OWNDOCK_AGENT_CA_CERT_PEM
    ca_private_key_env: OWNDOCK_AGENT_CA_KEY_PEM
    enrollment_ttl: 15m
    certificate_ttl: 720h

database:
  mongo:
    enabled: false
    uri_env: OWNDOCK_MONGODB_URI
    database: owndock
    connect_timeout: 10s
    operation_timeout: 5s
    max_idle_time: 5m
    min_pool_size: 0
    max_pool_size: 100
