services:
  mongodb-keyfile-init:
    image: mongo:8.3.7-noble@sha256:8444a416f2fc991f15064df9f6ea31ee02877607a70fd352ea998e6dbb5714b3
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        source=/run/secrets/mongodb-keyfile-source
        target=/target/keyfile
        checksum=/target/keyfile.sha256
        source_digest=$$(sha256sum "$$source" | awk '{print $$1}')
        if [ -e "$$target" ] || [ -e "$$checksum" ]; then
          test -f "$$target"
          test -f "$$checksum"
          test "$$(cat "$$checksum")" = "$$source_digest"
          test "$$(stat -c '%u:%g:%a' "$$target")" = "999:999:400"
          test "$$(stat -c '%u:%g:%a' "$$checksum")" = "0:0:400"
          exit 0
        fi
        cp "$$source" "$$target"
        chmod 0400 "$$target"
        printf '%s\n' "$$source_digest" >"$$checksum"
        chmod 0400 "$$checksum"
        chown 999:999 "$$target"
    volumes:
      - mongodb-keyfile:/target
    secrets:
      - mongodb-keyfile-source
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true

  mongodb:
    image: mongo:8.3.7-noble@sha256:8444a416f2fc991f15064df9f6ea31ee02877607a70fd352ea998e6dbb5714b3
    restart: unless-stopped
    depends_on:
      mongodb-keyfile-init:
        condition: service_completed_successfully
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --auth
      - --keyFile
      - /run/mongodb-keyfile/keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongodb-root-username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb-root-password
    volumes:
      - mongodb-data:/data/db
      - mongodb-keyfile:/run/mongodb-keyfile:ro
    secrets:
      - mongodb-root-username
      - mongodb-root-password
      - owndock-mongodb-tools-config
    networks:
      - data
    security_opt:
      - no-new-privileges:true

  mongodb-init:
    image: mongo:8.3.7-noble@sha256:8444a416f2fc991f15064df9f6ea31ee02877607a70fd352ea998e6dbb5714b3
    restart: "no"
    depends_on:
      - mongodb
    entrypoint: ["/bin/sh", "/opt/owndock/init-replica-set.sh"]
    volumes:
      - ./mongodb/init-replica-set.sh:/opt/owndock/init-replica-set.sh:ro
    secrets:
      - mongodb-root-username
      - mongodb-root-password
      - mongodb-app-password
      - mongodb-tools-password
    networks:
      - data
    security_opt:
      - no-new-privileges:true

  server:
    image: ${OWNDOCK_SERVER_IMAGE:?set a signed image@sha256 digest from CONTAINER_IMAGES.txt}
    restart: unless-stopped
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    command: ["-conf", "/etc/owndock/config.yaml"]
    ports:
      - 127.0.0.1:${OWNDOCK_HTTP_PORT:-8000}:8000
    volumes:
      - ./community.config.yaml:/etc/owndock/config.yaml:ro
    secrets:
      - owndock-bootstrap-token
      - owndock-mongodb-uri
    networks:
      - data
      - ingress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mongodb-data:
  mongodb-keyfile:

networks:
  data:
    internal: true
  ingress:

secrets:
  mongodb-keyfile-source:
    file: ${OWNDOCK_MONGODB_KEYFILE_PATH:?set the absolute MongoDB keyfile path}
  mongodb-root-username:
    file: ${OWNDOCK_MONGODB_ROOT_USERNAME_PATH:?set the absolute MongoDB root username file path}
  mongodb-root-password:
    file: ${OWNDOCK_MONGODB_ROOT_PASSWORD_PATH:?set the absolute MongoDB root password file path}
  mongodb-app-password:
    file: ${OWNDOCK_MONGODB_APP_PASSWORD_PATH:?set the absolute MongoDB application password file path}
  mongodb-tools-password:
    file: ${OWNDOCK_MONGODB_TOOLS_PASSWORD_PATH:?set the absolute MongoDB Database Tools password file path}
  owndock-bootstrap-token:
    file: ${OWNDOCK_BOOTSTRAP_TOKEN_PATH:?set the absolute OwnDock bootstrap token file path}
  owndock-mongodb-uri:
    file: ${OWNDOCK_MONGODB_URI_PATH:?set the absolute OwnDock MongoDB URI file path}
  owndock-mongodb-tools-config:
    file: ${OWNDOCK_MONGODB_TOOLS_CONFIG_PATH:?set the absolute MongoDB Database Tools config path}
