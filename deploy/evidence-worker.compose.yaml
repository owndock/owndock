services:
  evidence-egress-gateway:
    # The gateway is the only container attached to both the isolated Evidence
    # Boundary and an uplink. It receives no MongoDB, Registry, or KMS secret.
    image: ${OWNDOCK_EGRESS_GATEWAY_IMAGE:?set an immutable image digest}
    command: ["-scope", "evidence", "-conf", "/etc/owndock/config.yaml"]
    volumes:
      - ${OWNDOCK_CONFIG_FILE:?required}:/etc/owndock/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/usr/local/bin/owndock-egress-gateway", "-scope", "evidence", "-conf", "/etc/owndock/config.yaml", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      evidence-boundary:
        ipv4_address: ${OWNDOCK_EVIDENCE_EGRESS_GATEWAY_IP:-172.31.241.2}
      evidence-egress-uplink:

  evidence-worker:
    # Build and publish Dockerfile.evidence-worker first, then use only the
    # immutable image digest here. A mutable tag is intentionally rejected by
    # the deployment procedure even though Compose itself accepts one.
    image: ${OWNDOCK_EVIDENCE_WORKER_IMAGE:?set an immutable image digest}
    command: ["-conf", "/etc/owndock/config.yaml"]
    environment:
      OWNDOCK_MONGODB_URI: ${OWNDOCK_MONGODB_URI:?required}
    # Execution-only Registry passwords and provider-specific KMS credentials
    # are injected here. Keep this root-readable file outside the repository;
    # neither kind of credential is accepted through the OwnDock API.
    env_file:
      - ${OWNDOCK_EVIDENCE_SECRET_ENV_FILE:?required}
    volumes:
      - ${OWNDOCK_CONFIG_FILE:?required}:/etc/owndock/config.yaml:ro
      - ${OWNDOCK_TRUSTED_ROOTS_DIRECTORY:?required}:/etc/owndock/trusted-roots:ro
      # The updater atomically switches current inside this parent directory.
      # Evidence Worker sees every snapshot read-only and never updates it.
      - ${OWNDOCK_TRIVY_DATABASE_ROOT:?required}:/var/lib/owndock/trivy-db:ro
    read_only: true
    tmpfs:
      # Syft cache and bounded transient image data have no persistent volume.
      - /tmp:rw,noexec,nosuid,nodev,size=536870912,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    ports:
      - 127.0.0.1:${OWNDOCK_EVIDENCE_METRICS_PORT:-9092}:9092
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      evidence-egress-gateway:
        condition: service_healthy
    networks:
      - data
      - evidence-boundary

networks:
  data:
    # MongoDB must be attached to this named internal network by the base
    # deployment. Evidence Worker never reaches it through the egress gateway.
    external: true
    name: ${OWNDOCK_DATA_NETWORK_NAME:?set the existing internal MongoDB network name}
  evidence-boundary:
    # Worker and tool subprocesses have no direct default route. The configured
    # Registry HTTPS proxy must be the fixed gateway address on this network.
    internal: true
    ipam:
      config:
        - subnet: ${OWNDOCK_EVIDENCE_BOUNDARY_SUBNET:-172.31.241.0/24}
  evidence-egress-uplink:
    driver: bridge
