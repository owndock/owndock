server:
  http:
    address: 0.0.0.0:8000
    timeout: 30s
    shutdown_timeout: 15s
    cors_allowed_origins: []

product:
  enabled: true

runtime:
  deployment_worker:
    enabled: true
    poll_interval: 2s
    lease_duration: 30s
    operation_timeout: 10m
  inventory_worker:
    enabled: true
    poll_interval: 2s
    sync_interval: 5m
    retry_interval: 30s
    event_poll_interval: 1s
    event_wait: 2s
    lease_duration: 2m
    operation_timeout: 1m
    command_timeout: 20s
    concurrency: 2
    event_concurrency: 4
    candidate_limit: 256
    max_chunk_bytes: 49152

security:
  bootstrap_token_env: ""
  bootstrap_token_file: /run/secrets/owndock-bootstrap-token
  session_ttl: 24h

database:
  mongo:
    enabled: true
    uri_env: ""
    uri_file: /run/secrets/owndock-mongodb-uri
    database: owndock
    connect_timeout: 30s
    operation_timeout: 10s
    max_idle_time: 5m
    min_pool_size: 0
    max_pool_size: 100
